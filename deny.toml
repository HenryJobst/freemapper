# cargo-deny: licences, advisories, bans and sources of the dependencies (ADR 0154).
# Run `cargo deny check` before a release; CI runs it on every push.

[graph]
# The release builds; the dev tools are not shipped.
all-features = false

[licenses]
# freemapper is AGPL-3.0-or-later (ADR 0152). A dependency may use any of these, or an expression such as
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later" that offers one of them. A licence that is not listed fails the check:
# decide on it and add it here with the ADR.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[advisories]
# Known vulnerabilities and yanked or unmaintained crates come from the RustSec database.
yanked = "deny"
# Each ignore names the advisory, why it does not reach this program, and when to look again.
ignore = [
    # rmcp's OAuth client. freemapper builds rmcp with `server`, `transport-io` and `macros` only: a server on stdin
    # and stdout, no HTTP, no OAuth client. Fixed in rmcp 3.9.0; take it, and drop both rmcp ignores, once it is two
    # weeks old (the pin in Cargo.toml).
    { id = "RUSTSEC-2026-0457", reason = "OAuth client of rmcp, not built here" },
    # rmcp's Streamable HTTP client. Same features as above: no HTTP client is built.
    { id = "RUSTSEC-2026-0462", reason = "Streamable HTTP client of rmcp, not built here" },
    # Only at build time: askama reads its templates with it when world_magnetic_model is compiled; nothing of it is
    # in the program. Look again when world_magnetic_model moves to a newer askama.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained, build dependency of askama only" },
]

[bans]
# Two versions of one crate are common while its users move at different speeds; only report them.
multiple-versions = "warn"
# The workspace and the freemapper-core crates are path or git dependencies without a version.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# freemapper-core, pinned by tag (ADR 0067).
allow-git = ["https://github.com/HenryJobst/freemapper-core"]

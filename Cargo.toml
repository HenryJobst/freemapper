[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryJobst/freemapper"
rust-version = "1.88"

[workspace.dependencies]
freemapper = { path = "crates/freemapper" }
# Shared crates of the suite, all pinned to one release tag of freemapper-core (ADR 0067), so the
# lock file holds a single copy of the core workspace.
freemapper-fs = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.18.0" }
freemapper-georef = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.18.0" }
freemapper-web = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.18.0" }
# Program texts with Fluent and the language detection of the suite (ADR 0092).
freemapper-text = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.18.0" }
# The suite contract (ADR 0095): the program links the shared types only (map kinds, reserved words); the
# tests add the fixtures, the vocabulary and the rules.
freemapper-contract = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.18.0", default-features = false }
# The self-update: manifest, signature check, version order and the swap; no network (ADR 0067).
freemapper-update = { git = "https://github.com/HenryJobst/freemapper-core", tag = "v0.18.0" }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
contour = "0.13.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
# Free disk space (statvfs, GetDiskFreeSpaceExW) without unsafe code of our own; pinned to a
# release known to be older than two weeks. Only the space query is used, not the file locks.
fs4 = { version = "=0.13.1", default-features = false }
geo = "0.33.1"
geo-types = "0.7.20"
geojson = "1.0.0"
osmpbf = "0.3.8"
# Pinned: newer releases are younger than two weeks.
las = { version = "=0.11.1", features = ["laz"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
crc32fast = "1.5.4"
miniz_oxide = "0.9.1"
# Tests only: the key parser of freemapper-update, to check the committed public keys; same pin as
# in freemapper-core, already in Cargo.lock through it.
minisign-verify = "=0.3.0"
pdf-writer = "0.15.0"
quick-xml = "0.42.0"
rust-embed = { version = "8.13.0", features = ["debug-embed", "mime-guess"] }
# Pinned: newer releases are younger than two weeks. rmcp-macros is held at 3.6.0 in
# Cargo.lock only (rmcp asks for ^3.6.0), so build with --locked.
rmcp = { version = "=3.6.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tiff = "0.11.3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }
toml = "1.2.1"
# Pinned: newer releases are younger than two weeks.
ureq = "=3.4.2"
# Windows only: the volume serial number of a folder (GetFileInformationByHandle) without
# unsafe code of our own; already in Cargo.lock through same-file.
winapi-util = "=0.1.11"
# Lenient TIFF LZW (chunks without an end code); already in Cargo.lock through tiff.
weezl = "0.1.12"
world_magnetic_model = "1.2025.0"
# Pinned: newer releases are younger than two weeks.
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

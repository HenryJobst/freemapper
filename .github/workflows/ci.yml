name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: the label `all-systems` asks for macOS and Windows on a pull request.
    types: [opened, synchronize, reopened, labeled]

# A newer push to a pull request replaces the run of the older one; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Line numbers in backtraces are enough here; full debug info only makes linking and the
  # cache slower.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs on Linux only; the label `all-systems` and every push to main run
        # on all three systems.
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'all-systems') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # The tests that sign a manifest with the minisign CLI fail instead of skipping when it is
      # missing. They are unix-only, so Windows needs no minisign.
      FREEMAPPER_TEST_REQUIRE_MINISIGN: "1"
    steps:
      # Actions pinned to commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install minisign
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Install minisign
        if: runner.os == 'macOS'
        run: brew install minisign
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The update command and the MCP update tools against a stub server, and `find` against a
      # stored search answer: only a debug build with this feature reaches them.
      - run: cargo clippy --locked -p freemapper-cli --all-targets --features test-stub -- -D warnings
      - run: cargo test --locked -p freemapper-cli --features test-stub --test cli --test mcp --test select update -- find_cli

  # The golden net of the adapter work (ADR 0082): five layers that must stay as they are while
  # the region enums become adapters. G3 and G4 replay the recorded answers of the data services
  # from the fixture store that store.lock names (tests/golden/adapters/README.md).
  golden:
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs on Linux only; the label `all-systems` and every push to main run
        # on all three systems.
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'all-systems') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/golden-adapters
          key: golden-adapters-${{ hashFiles('tests/golden/adapters/store.lock') }}
      - run: tests/golden-store.sh
      - run: scripts/golden.sh test
      # The outputs that differ from the recording, to compare them with another system's.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: golden-diff-${{ matrix.os }}
          path: target/golden-diff
          if-no-files-found: ignore

  # A commit that changes a golden file says so with a `Golden-Bless:` trailer, and a refactor
  # never changes one. Checked for every commit of the push or the pull request.
  golden-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: tests/golden-guard.sh
      - run: .github/scripts/check-golden-untouched.sh "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && 'HEAD' || github.sha }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The tests that sign a manifest with the minisign CLI fail instead of skipping when it is
      # missing. They are unix-only, so Windows needs no minisign.
      FREEMAPPER_TEST_REQUIRE_MINISIGN: "1"
    steps:
      # Actions pinned to commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain and components named in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install minisign
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Install minisign
        if: runner.os == 'macOS'
        run: brew install minisign
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      # The golden net of the adapter work (ADR 0082). Its layers G3 and G4 replay the recorded
      # answers of the data services from the fixture store that store.lock names.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/golden-adapters
          key: golden-adapters-${{ hashFiles('tests/golden/adapters/store.lock') }}
      - run: tests/golden-store.sh
        shell: bash
      - run: scripts/golden.sh test
        shell: bash
      # The update command and the MCP update tools against a stub server: only a debug build with
      # this feature reaches them.
      - run: cargo clippy --locked -p freemapper-cli --all-targets --features test-stub -- -D warnings
      - run: cargo test --locked -p freemapper-cli --features test-stub --test cli --test mcp --test select update

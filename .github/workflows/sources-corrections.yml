name: Sources corrections

# Signs corrections/freemapper-sources.json with the release key and publishes it as the assets of
# the pre-release "sources" (issue #273, stage 4, ADR 0189). Programs fetch it only on request,
# with `freemapper sources update`, and check the signature with the key in the program. The
# pre-release is never "latest", so the update check of a release is not touched by it.
#
# Started by hand; the environment `release` holds the signing secrets and its protection rule asks
# for approval, as for a release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: sign and check, keep the files as a workflow artifact, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sources-corrections
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Holds the signing secrets; protection rules on this environment guard them.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Check the list
        run: |
          set -euo pipefail
          list=corrections/freemapper-sources.json
          jq -e '.format == 1 and (.issued | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and (.corrections | type == "array")' "$list" >/dev/null
          size=$(wc -c < "$list")
          if [ "$size" -gt 65536 ]; then echo "The list is larger than 64 KiB." >&2; exit 1; fi
          mkdir out
          cp "$list" out/freemapper-sources.json
      - name: Sign the list
        # The secrets reach the shell only as environment variables. The key file lives only in
        # this step and is removed when it ends, also when it fails.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "The secret MINISIGN_SECRET_KEY is not set; no list without a signature." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          printf '%s\n' "$MINISIGN_PASSWORD" \
            | minisign -S -s "$key" -m out/freemapper-sources.json -t "freemapper-sources.json $(jq -r .issued out/freemapper-sources.json)"
      - name: Verify the signature with the public key in the program
        run: |
          set -euo pipefail
          minisign -V -p assets/update/minisign.pub -m out/freemapper-sources.json
          # freemapper accepts only prehashed signatures: algorithm "ED", whose base64 starts with "RU".
          case "$(sed -n 2p out/freemapper-sources.json.minisig)" in
            RU*) ;;
            *)
              echo "The signature is not prehashed; freemapper would refuse it." >&2
              exit 1
              ;;
          esac
          ls -l out
      - name: Keep the dry run as a workflow artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources-corrections
          path: out/
          if-no-files-found: error
          retention-days: 3
      - name: Publish the list
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view sources -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create sources -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Corrections of addresses" \
              --notes "The signed list of corrections of addresses that freemapper fetches with freemapper sources update. It is replaced by every publication; see corrections/README.md." \
              --target "$GITHUB_SHA"
          fi
          gh release upload sources -R "$GITHUB_REPOSITORY" --clobber \
            out/freemapper-sources.json out/freemapper-sources.json.minisig

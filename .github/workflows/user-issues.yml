name: Issues of users

# Marks every issue that does not come from the maintainer or a collaborator with the label
# `von-nutzer` (ADR 0180), so that the issues of users stand out from the maintainer's own and are
# looked at first. Only the label is set; the text of the issue is never read.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label an issue of a user
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) echo "issue $NUMBER is from the project; no label" ;;
            *) gh issue edit "$NUMBER" --add-label von-nutzer ;;
          esac

name: Services nightly

# Asks every geodata service the built-in adapters name once (`freemapper adapters probe`, ADR 0186)
# and keeps the status on the branch `status`, which holds nothing else; the website reads it
# there. A service counts as down after two bad nights in a row. When that changes, one issue says
# which services are down and is closed when they answer again. Never part of the CI of a pull
# request: about 85 requests a night, from a GitHub datacentre that some agencies throttle.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  ISSUE_TITLE: "Geodienste: Ausfälle erkannt"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Last night's status
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/status/status.json" \
            -o "$RUNNER_TEMP/previous.json" || echo '{}' >"$RUNNER_TEMP/previous.json"
      - name: Ask the services
        run: |
          mkdir -p "$RUNNER_TEMP/status"
          cargo run --locked -q -p freemapper-cli -- adapters probe \
            --status "$RUNNER_TEMP/previous.json" \
            >"$RUNNER_TEMP/status/status.json" 2>"$RUNNER_TEMP/changes.txt"
          cat "$RUNNER_TEMP/changes.txt"
          jq '{updated, down: (.down_by_adapter | keys)}' "$RUNNER_TEMP/status/status.json"
      - name: Publish on the branch status
        run: |
          cd "$RUNNER_TEMP/status"
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "chore(status): service status"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          status="$RUNNER_TEMP/status/status.json"
          changes="$RUNNER_TEMP/changes.txt"
          down=$(jq '[.services[] | select(.down)] | length' "$status")
          number=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title -q "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ ! -s "$changes" ]; then
            echo "no change tonight; $down services down"
            exit 0
          fi
          {
            echo "Zwei Nächte in Folge antworteten diese Dienste nicht (Stand $(jq -r .updated "$status")):"
            echo
            jq -r '.services | to_entries[] | select(.value.down)
              | "- `\(.key)` (\(.value.adapters | join(", "))), seit \(.value.down_since): \(.value.detail // .value.status)"' "$status"
            echo
            echo "Lauf: $RUN_URL. Die Website zeigt den Hinweis automatisch (Issue #286)."
          } >"$RUNNER_TEMP/body.md"
          if [ "$down" -gt 0 ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/body.md"
            else
              gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
              gh issue comment "$number" --body "Neuer Stand nach dem nächtlichen Lauf: $RUN_URL"
            fi
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Alle Dienste antworten wieder (Lauf: $RUN_URL)."
            gh issue close "$number"
          fi

[package]
name = "freemapper"
description = "Builds OpenOrienteering Mapper starter projects from official geodata and OSM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Test helpers for the golden net of the adapter work (tests/adapters_golden.rs): the fixed clock
# and the facts the enums answer. The crate's own tests turn it on through a dev-dependency on
# itself; it is never part of a release build.
golden = ["dep:sha2"]

[dependencies]
chrono.workspace = true
contour.workspace = true
dirs.workspace = true
freemapper-fs.workspace = true
freemapper-georef.workspace = true
freemapper-contract.workspace = true
freemapper-text.workspace = true
fs4.workspace = true
geo.workspace = true
geo-types.workspace = true
geojson.workspace = true
image.workspace = true
las.workspace = true
osmpbf.workspace = true
crc32fast.workspace = true
miniz_oxide.workspace = true
pdf-writer.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tiff.workspace = true
toml.workspace = true
ureq.workspace = true
weezl.workspace = true
world_magnetic_model.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[lints]
workspace = true

[dev-dependencies]
freemapper = { workspace = true, features = ["golden"] }
freemapper-contract = { workspace = true, features = ["fixtures"] }
quick-xml.workspace = true
sha2.workspace = true
tempfile.workspace = true

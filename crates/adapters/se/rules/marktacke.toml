# The classes of the land cover of Lantmäteriet (`objekttyp` of the table `mark`) as the LGB
# `nutzart` they stand for. A class that is not here is left out of the map and named once in a
# progress line. `Öppen mark` (open land) holds fields, meadows, clearings and bare rock alike, so
# it says nothing a land use class can say and is not named; the terrain and the point cloud show
# what grows there. The classes below the first seven are the ones the product description lists and
# the first municipality did not show; a name that never comes up does no harm.
ignored = ["Öppen mark"]

[classes]
"Barr- och blandskog" = "Wald"
"Låg bebyggelse" = "Wohnbaufläche"
"Hög bebyggelse" = "Fläche gemischter Nutzung"
"Industri- och handelsbebyggelse" = "Industrie- und Gewerbefläche"
"Sjö" = "Stehendes Gewässer"
"Vattendragsyta" = "Fließgewässer"
"Torg" = "Platz"
"Lövskog" = "Wald"
"Åker" = "Landwirtschaft"
"Hav" = "Meer"

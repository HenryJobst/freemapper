# Sweden: the terrain model, the laser data and the land cover of Lantmäteriet through its STAC
# catalogues (ADR 0203). No orthophoto (ADR 0202), no buildings in this stage.
format = 1

[adapter]
id = "sweden"
provider = "lantmateriet"
revision = 1
min_freemapper = "0.28.0"
crs = 25833
object_id_prefix = "SE"
names = { en = "Sweden", de = "Schweden" }
agency = "Lantmäteriet"
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-27"

[net]
hosts = ["api.lantmateriet.se", "dl1.lantmateriet.se"]

# Natural Earth 1:10m, public domain; the land border to a few hundred metres.
[boundary]
file = "boundary.geojson"
crs = 4326

[[osm.extract]]
geofabrik = "europe/sweden"
megabytes = 1020
label = "Sweden"

[attribution]
licence = "cc-by-4.0"
text = "© Lantmäteriet (CC BY 4.0; laser data: terms of Geotorget)"
short = "© Lantmäteriet"
note = "Terrain model and land cover: CC BY 4.0. The STAC catalogue gives the laser data (Laserdata Skog) the licence \"other\"; its terms are in Geotorget."

# The land cover of Marktäcke, one GeoPackage per municipality.
[alkis]
kind = "stac-gpkg"
stac = "https://api.lantmateriet.se/stac-vektor/v1"
collection = "marktacke"

# The terrain model, read by range from the 10 km tiles; no orthophoto.
[terrain]
backend = "lantmateriet"
endpoints = { stac-hojd = "https://api.lantmateriet.se/stac-hojd/v1", stac-vektor = "https://api.lantmateriet.se/stac-vektor/v1" }

# Laserdata Skog, whole COPC tiles.
[point_cloud]
kind = "stac-copc"
url = "https://api.lantmateriet.se/stac-hojd/v1"

# Basic authentication of the Geotorget account for the download host.
[auth]
host = "dl1.lantmateriet.se"
user_env = "FREEMAPPER_LM_USER"
password_env = "FREEMAPPER_LM_PASSWORD"
products = ["Markhöjdmodell Nedladdning", "Laserdata Skog", "Marktäcke"]

# Bavaria: the rasters of the Bayerische Vermessungsverwaltung through code (a WMS for the
# orthophoto, 1 km tiles for the terrain model and for the surface model of 20 cm). The state
# has no service for its cadastre: buildings and land use are read by code out of files, the
# LoD2 tiles and the Shapefile of each Kreis. The laser point clouds for the vegetation lie on a
# third host. Springs, caves, towers, monuments, fountains and other point and line objects
# come from the landscape model, the ATKIS Basis-DLM, read like a NAS service.
format = 1

[adapter]
id = "bayern"
provider = "ldbv"
revision = 3
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DEBY"
names = { en = "Bavaria", de = "Bayern" }
agency = "LDBV"
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-14"

[net]
hosts = ["geoservices.bayern.de", "download1.bayernwolke.de", "geodaten.bayern.de", "geoportal.bafg.de", "www.lfu.bayern.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/bayern/mittelfranken"
megabytes = 91.0
label = "Bayern, Mittelfranken"
boundary = "osm-mittelfranken.geojson"
cache_prefix = "by-mittelfranken"

[[osm.extract]]
geofabrik = "europe/germany/bayern/niederbayern"
megabytes = 91.0
label = "Bayern, Niederbayern"
boundary = "osm-niederbayern.geojson"
cache_prefix = "by-niederbayern"

[[osm.extract]]
geofabrik = "europe/germany/bayern/oberbayern"
megabytes = 248.0
label = "Bayern, Oberbayern"
boundary = "osm-oberbayern.geojson"
cache_prefix = "by-oberbayern"

[[osm.extract]]
geofabrik = "europe/germany/bayern/oberfranken"
megabytes = 90.0
label = "Bayern, Oberfranken"
boundary = "osm-oberfranken.geojson"
cache_prefix = "by-oberfranken"

[[osm.extract]]
geofabrik = "europe/germany/bayern/oberpfalz"
megabytes = 81.0
label = "Bayern, Oberpfalz"
boundary = "osm-oberpfalz.geojson"
cache_prefix = "by-oberpfalz"

[[osm.extract]]
geofabrik = "europe/germany/bayern/schwaben"
megabytes = 122.0
label = "Bayern, Schwaben"
boundary = "osm-schwaben.geojson"
cache_prefix = "by-schwaben"

[[osm.extract]]
geofabrik = "europe/germany/bayern/unterfranken"
megabytes = 99.0
label = "Bayern, Unterfranken"
boundary = "osm-unterfranken.geojson"
cache_prefix = "by-unterfranken"

# The source note the agency's FAQ gives for changed data; it names no year.
[attribution]
licence = "cc-by-4.0"
text = "Geobasisdaten: Bayerische Vermessungsverwaltung – www.geodaten.bayern.de (Daten verändert), Lizenz: CC BY 4.0"
short = "Bayerische Vermessungsverwaltung"
note = "Lizenz CC BY 4.0 (Namensnennung 4.0 International): https://creativecommons.org/licenses/by/4.0/"

[orthophoto]
backend = "ldbv"
url = "https://geoservices.bayern.de/od/wms/dop/v1/dop20"
layer = "by_dop20c"
max_px = 6000

[terrain]
backend = "ldbv"

[surface]
backend = "ldbv"

[[extra.nas]]
name = "LDBV ATKIS Basis-DLM"
url = "https://geoservices.bayern.de/wfs/v1/ogc_atkis_basisdlm.cgi"
model = "basis-dlm"
namespaces = "xmlns(adv,http://www.adv-online.de/namespaces/adv/gid/7.1)"
max_count = 100000
max_bytes = 268435456

# The Naturdenkmale and Landschaftsbestandteile of the LfU, single ones and areas (issue #273).
[[permits.wfs]]
key = "naturschutz"
label = { en = "Bayerisches Landesamt für Umwelt", de = "Bayerisches Landesamt für Umwelt" }
what = { en = "Naturdenkmale and Landschaftsbestandteile", de = "Naturdenkmale und Landschaftsbestandteile" }
credit = "Creative Commons Namensnennung 4.0 International (CC BY 4.0); Datenquelle: Bayerisches Landesamt für Umwelt, www.lfu.bayern.de"
sections = ["protected-objects"]
url = "https://www.lfu.bayern.de/gdi/wfs/natur/schutzgebiete"
output_format = "GEOJSON"
layers = [
    { key = "naturdenkmale-punkte", type_name = "natur_wfsschutzgebiete:naturdenkmal_punktfoermig", reading = "object", object = "natural-monument", name = "name" },
    { key = "naturdenkmale-flaechen", type_name = "natur_wfsschutzgebiete:naturdenkmal_flaechig", reading = "object", object = "natural-monument", name = "name" },
    { key = "landschaftsbestandteile-punkte", type_name = "natur_wfsschutzgebiete:landschaftsbestandteil_punktfoermig", reading = "object", object = "protected-landscape-part", name = "name" },
    { key = "landschaftsbestandteile-flaechen", type_name = "natur_wfsschutzgebiete:landschaftsbestandteil_flaechig", reading = "object", object = "protected-landscape-part", name = "name" },
]

# The point clouds the vegetation candidates are read from (issue #273): the backend of the state keeps the names of the
# tiles and how it reads the answers, the manifest holds where.
[point_cloud]
kind = "laz-tiles"
url = "https://geodaten.bayern.de/odd_data/laser"

[preview]
wms = "https://geoservices.bayern.de/od/wms/dop/v1/dop20"
layer = "by_dop20c"
format = "image/jpeg"
attribution = "Bayerische Vermessungsverwaltung – www.geodaten.bayern.de, CC BY 4.0"
agency = "LDBV"

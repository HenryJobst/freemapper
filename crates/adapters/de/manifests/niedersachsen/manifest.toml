# Lower Saxony: LGLN's WFS; WMS, WCS and the STAC dates through code, which also says how old the images are.
format = 1

[adapter]
id = "niedersachsen"
provider = "lgln"
revision = 2
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DENI"
names = { en = "Lower Saxony", de = "Niedersachsen" }
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-15"

[net]
hosts = ["opendata.lgln.niedersachsen.de", "opendata.geoservices.lgln.niedersachsen.de", "dop.stac.lgln.niedersachsen.de", "dgm.stac.lgln.niedersachsen.de", "dom.stac.lgln.niedersachsen.de", "geoportal.bafg.de", "www.umweltkarten-niedersachsen.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/niedersachsen"
megabytes = 510
label = "Lower Saxony"

[attribution]
licence = "cc-by-4.0"
text = "© GeoBasis-DE/LGLN {year}, Daten geändert, CC BY 4.0"
note = "Lizenz CC BY 4.0 (Namensnennung 4.0 International): https://creativecommons.org/licenses/by/4.0/"

[alkis]
kind = "wfs"
name = "LGLN ALKIS"
crs = 25832
url = "https://opendata.lgln.niedersachsen.de/doorman/noauth/alkis_wfs_einfach"
buildings_type = "ave:GebaeudeBauwerk"
land_use_type = "ave:NutzungFlurstueck"
square_bez = "ohne Unterart (Niedersachsen)"

[orthophoto]
backend = "lgln"

[terrain]
backend = "lgln"

[surface]
backend = "lgln"

[[extra.nas]]
name = "LGLN ALKIS (NAS)"
url = "https://opendata.lgln.niedersachsen.de/doorman/noauth/alkis_wfs_nas"
namespaces = "xmlns(adv,http://www.adv-online.de/namespaces/adv/gid/7.1)"
max_count = 10000
max_bytes = 268435456

# The Naturdenkmale and geschützte Landschaftsbestandteile of the NLWKN's map service (ArcGIS REST, ADR 0148),
# areas and points; `type_name` is the number of the layer in the service (issue #273). The biotopes are kept by the
# Landkreise.
[[permits.arcgis]]
key = "naturschutz"
label = { en = "NLWKN", de = "NLWKN" }
what = { en = "Naturdenkmale and geschützte Landschaftsbestandteile", de = "Naturdenkmale und geschützte Landschaftsbestandteile" }
credit = "Datenlizenz Deutschland – Namensnennung – Version 2.0 (dl-de/by-2-0); Quelle: Niedersächsischer Landesbetrieb für Wasserwirtschaft, Küsten- und Naturschutz (NLWKN)"
gaps = { en = "the protected biotopes are kept by the Landkreise and are not in them", de = "Die geschützten Biotope führen die Landkreise; sie fehlen darin" }
sections = ["protected-objects"]
url = "https://www.umweltkarten-niedersachsen.de/arcgis/rest/services/Natur_wms/MapServer"
layers = [
    { key = "naturdenkmale-flaechen", type_name = "190", reading = "object", object = "natural-monument", name = "name" },
    { key = "naturdenkmale-punkte", type_name = "7", reading = "object", object = "natural-monument", name = "name" },
    { key = "landschaftsbestandteile-flaechen", type_name = "10", reading = "object", object = "protected-landscape-part", name = "name" },
    { key = "landschaftsbestandteile-punkte", type_name = "12", reading = "object", object = "protected-landscape-part", name = "name" },
]

[preview]
wms = "https://opendata.lgln.niedersachsen.de/doorman/noauth/dop_wms"
layer = "ni_dop20"
format = "image/jpeg"
attribution = "© GeoBasis-DE/LGLN, CC BY 4.0"
agency = "LGLN"

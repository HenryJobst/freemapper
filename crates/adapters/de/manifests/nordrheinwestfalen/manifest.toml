# North Rhine-Westphalia: the WFS of Geobasis NRW; orthophoto and the tile lists of the heights through code.
format = 1

[adapter]
id = "nordrheinwestfalen"
provider = "geobasisnrw"
revision = 3
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DENW"
names = { en = "North Rhine-Westphalia", de = "Nordrhein-Westfalen" }
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-15"

[net]
hosts = ["www.wfs.nrw.de", "www.wms.nrw.de", "www.opengeodata.nrw.de", "geoportal.stadt-koeln.de", "open-data.dortmund.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/nordrhein-westfalen/arnsberg-regbez"
megabytes = 195.2
label = "North Rhine-Westphalia, Arnsberg"
boundary = "osm-arnsberg.geojson"
cache_prefix = "nrw-arnsberg"

[[osm.extract]]
geofabrik = "europe/germany/nordrhein-westfalen/detmold-regbez"
megabytes = 137.3
label = "North Rhine-Westphalia, Detmold"
boundary = "osm-detmold.geojson"
cache_prefix = "nrw-detmold"

[[osm.extract]]
geofabrik = "europe/germany/nordrhein-westfalen/duesseldorf-regbez"
megabytes = 217.2
label = "North Rhine-Westphalia, Düsseldorf"
boundary = "osm-duesseldorf.geojson"
cache_prefix = "nrw-duesseldorf"

[[osm.extract]]
geofabrik = "europe/germany/nordrhein-westfalen/koeln-regbez"
megabytes = 225.2
label = "North Rhine-Westphalia, Köln"
boundary = "osm-koeln.geojson"
cache_prefix = "nrw-koeln"

[[osm.extract]]
geofabrik = "europe/germany/nordrhein-westfalen/muenster-regbez"
megabytes = 140.9
label = "North Rhine-Westphalia, Münster"
boundary = "osm-muenster.geojson"
cache_prefix = "nrw-muenster"

[attribution]
licence = "dl-de/zero-2-0"
text = "Geobasisdaten © Geobasis NRW (Bezirksregierung Köln) {year}, dl-de/zero-2-0"

[alkis]
kind = "wfs"
name = "Geobasis NRW ALKIS"
crs = 25832
url = "https://www.wfs.nrw.de/geobasis/wfs_nw_alkis_vereinfacht"
buildings_type = "ave:GebaeudeBauwerk"
land_use_type = "ave:NutzungFlurstueck"
square_bez = "ohne Unterart (Nordrhein-Westfalen)"

[orthophoto]
backend = "geobasis-nrw"

[terrain]
backend = "geobasis-nrw"

[surface]
backend = "geobasis-nrw"

[[extra.nas]]
name = "Geobasis NRW ALKIS (NAS)"
url = "https://www.wfs.nrw.de/geobasis/wfs_nw_alkis_aaa-modell-basiert"
namespaces = "xmlns(adv,http://www.adv-online.de/namespaces/adv/gid/7.1)"
max_count = 100000
max_bytes = 268435456

[[extra.trees]]
id = "koeln"
name = "Köln tree cadastre"
crs = 25832
envelope = [342000, 5632000, 372000, 5663000]
format = "wfs-geojson"
type_name = "ms:baumkataster"
output_format = "GEOJSON"
endpoints = [
    "https://geoportal.stadt-koeln.de/wss/service/baumkataster_extern_wfs/guest",
]
fields = { kind = "Botanischer_Name", id = "Baumnummer", species = "Deutscher_Name", crown = "Kronendurchmesser_-_m" }
attribution = "Stadt Köln, Baumkataster, dl-de/zero-2-0"
max_bytes = 268435456

[[extra.trees]]
id = "dortmund"
name = "Dortmund tree cadastre"
crs = 25832
envelope = [381000, 5696000, 406000, 5718000]
format = "ods-geojson-export"
geo_field = "geo_point_2d"
endpoints = [
    "https://open-data.dortmund.de/api/explore/v2.1/catalog/datasets/baumkataster/exports/geojson",
]
fields = { kind = "art_botani", id = "id", date = "edatum", species = "art_deutsc", crown = "kronendurc" }
attribution = "Stadt Dortmund, Baumkataster, dl-de/zero-2-0"
max_bytes = 268435456

# The legally protected biotopes of LINFOS, without their type (the service gives it only in a
# report page), issue #273.
[[permits.wfs]]
key = "biotope"
label = { en = "LINFOS", de = "LINFOS" }
what = { en = "legally protected biotopes", de = "gesetzlich geschützte Biotope" }
credit = "Open Data - Dieses Angebot vom Landesamt für Natur, Umwelt und Verbraucherschutz Nordrhein-Westfalen ist lizensiert unter der Datenlizenz Deutschland Namensnennung 2.0 (https://www.govdata.de/dl-de/by-2-0). Datensätze unter dieser Lizenz müssen bei Weiterverwendung mit dem Quellenverweis „Land NRW“ versehen werden."
sections = ["protected-objects"]
url = "https://www.wfs.nrw.de/umwelt/linfos"
output_format = "GEOJSON"
layers = [
    { key = "flaechen", type_name = "wfs_linfos:gbt_polygon", reading = "object", object = "biotope" },
    { key = "punkte", type_name = "wfs_linfos:gbt_point", reading = "object", object = "biotope" },
]

[preview]
wms = "https://www.wms.nrw.de/geobasis/wms_nw_dop"
layer = "nw_dop_rgb"
format = "image/jpeg"
attribution = "Geobasisdaten © Geobasis NRW (Bezirksregierung Köln), dl-de/zero-2-0"
agency = "Geobasis NRW"

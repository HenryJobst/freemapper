# Schleswig-Holstein: LVermGeo SH's WFS; rasters from the download portal, whose certificates are pinned, through code.
format = 1

[adapter]
id = "schleswigholstein"
provider = "lvermgeosh"
revision = 4
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DESH"
names = { en = "Schleswig-Holstein", de = "Schleswig-Holstein" }
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-15"

[net]
hosts = ["dienste.gdi-sh.de", "service.gdi-sh.de", "geodaten.schleswig-holstein.de", "umweltgeodienste.schleswig-holstein.de", "opendata.schleswig-holstein.de", "opendata.luebeck.de", "ims.kiel.de", "geoservice.norderstedt.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/schleswig-holstein"
megabytes = 159
label = "Schleswig-Holstein"

[attribution]
licence = "cc-by-4.0"
text = "© GeoBasis-DE/LVermGeo SH/CC BY 4.0 (Quelle verändert)"
note = "Lizenz CC BY 4.0 (Namensnennung 4.0 International): https://creativecommons.org/licenses/by/4.0/"

[alkis]
kind = "wfs"
name = "LVermGeo SH ALKIS"
crs = 25832
url = "https://dienste.gdi-sh.de/WFS_SH_ALKIS_VWG_OpenGBD"
buildings_type = "ave:GebaeudeBauwerk"
land_use_type = "ave:NutzungFlurstueck"
square_bez = "ohne Unterart (Schleswig-Holstein)"

[orthophoto]
backend = "lvermgeo-sh"

[terrain]
backend = "lvermgeo-sh"

[surface]
backend = "lvermgeo-sh"

[[extra.nas]]
name = "LVermGeo SH ATKIS Basis-DLM"
url = "https://dienste.gdi-sh.de/WFS_SH_ATKIS_BDLM_SF_OpenGBD"
model = "basis-dlm"
namespaces = "xmlns(adv,http://www.adv-online.de/namespaces/adv/gid/7.1)"
max_count = 10000
max_bytes = 268435456

[[extra.trees]]
id = "luebeck"
name = "Lübeck tree cadastre"
crs = 25832
envelope = [602000, 5959000, 625000, 5984000]
format = "csv"
x_field = "RECHTSWERT"
y_field = "HOCHWERT"
separator = ";"
endpoints = [
    "https://opendata.luebeck.de/bereich/5.660/stadtgruen/baumkataster/baumkataster.csv",
]
fields = { kind = "GATTUNG", id = "BAUMNUMMER", species = "GA_LANG" }
skipped_kinds = ["Fehlplatz"]
attribution = "Hansestadt Lübeck, Abteilung Grün und Freiräume, Baumkataster, CC0"
max_bytes = 67108864

[[extra.trees]]
id = "kiel"
name = "Kiel tree cadastre"
crs = 25832
envelope = [567000, 6012000, 580000, 6033000]
format = "wfs-geojson"
type_name = "lhkiel:Baeume"
output_format = "GEOJSON"
endpoints = [
    "https://ims.kiel.de/geodatenextern/services/Stadtplan/LHKielWmsWfs/MapServer/WFSServer",
]
fields = { kind = "Baumart__bot._", id = "Baumnummer", species = "Baumart", crown = "Kronendurchmesser__m_" }
attribution = "Landeshauptstadt Kiel, CC BY 4.0"
max_bytes = 268435456

[[extra.trees]]
id = "norderstedt"
name = "Norderstedt tree cadastre"
crs = 25832
envelope = [561000, 5944000, 571000, 5957000]
format = "wfs-geojson"
type_name = "gru:gruen_baum"
output_format = "application/json"
endpoints = [
    "https://geoservice.norderstedt.de/geoserver/gru/wfs",
]
fields = { kind = "art_bot", id = "baumnr", species = "art_de", crown = "kronenm" }
attribution = "Herausgeber: Stadtverwaltung Norderstedt, dl-de/by-2-0"
max_bytes = 268435456

# The state forest, the Naturwald and the water protection zones of the environment services (a deegree WFS
# that answers GML 3.2 only), issue #273.
[[permits.wfs]]
key = "umwelt"
label = { en = "Umweltportal Schleswig-Holstein", de = "Umweltportal Schleswig-Holstein" }
what = { en = "state forest with its Reviere, Naturwald, water protection zones", de = "Landeswald mit seinen Revieren, Naturwald, Wasserschutzgebiete" }
credit = "Quellenvermerk: LfU SH; Lizenz: Creative Commons Namensnennung 4.0 International (CC BY 4.0)"
sections = ["state-forest", "forest-units", "forest-functions", "water-protection"]
url = "https://umweltgeodienste.schleswig-holstein.de/WFS_UWAT"
output_format = "application%2Fgml%2Bxml%3B%20version%3D3.2"
gml = true
layers = [
    { key = "landeswald", type_name = "app:shlf_gesamtflaeche", reading = "state-forest", owner = "Bundesland Schleswig-Holstein", prefix = "Schleswig-Holsteinische Landesforsten, Revier ", office = "reviername" },
    { key = "reviere", type_name = "app:shlf_gesamtflaeche", reading = "unit", administration = "Schleswig-Holsteinische Landesforsten", prefix = "Revier ", office = "reviername" },
    { key = "naturwald", type_name = "app:shlf_naturwald", reading = "function", function = "natural" },
    { key = "wasserschutzgebiete", type_name = "app:wsg_zonen", reading = "water", name = "wsg_name", zone = "wsg_zone" },
]

# The Naturdenkmale and geschützte Landschaftsbestandteile of the INSPIRE service (a deegree WFS that
# answers GML 3.2 only, CC BY 4.0), issue #273. The Kreise reported few of them.
[[permits.wfs]]
key = "naturschutz"
label = { en = "INSPIRE protected sites of Schleswig-Holstein", de = "INSPIRE-Schutzgebiete Schleswig-Holstein" }
what = { en = "Naturdenkmale, geschützte Landschaftsbestandteile", de = "Naturdenkmale, geschützte Landschaftsbestandteile" }
credit = "© GeoBasis-DE/LVermGeo SH/CC BY 4.0"
gaps = { en = "The Naturdenkmale come almost only from the Kreis Schleswig-Flensburg, the Landschaftsbestandteile only from Kiel, Lübeck and the Kreise Plön, Schleswig-Flensburg and Stormarn; ask the lower nature conservation authority for the others", de = "Die Naturdenkmale stammen fast nur aus dem Kreis Schleswig-Flensburg, die Landschaftsbestandteile nur aus Kiel, Lübeck und den Kreisen Plön, Schleswig-Flensburg und Stormarn; die übrigen kennt die untere Naturschutzbehörde" }
sections = ["protected-objects"]
url = "https://service.gdi-sh.de/SH_INSPIREDOWNLOAD_AI_PS"
output_format = "application%2Fgml%2Bxml%3B%20version%3D3.2"
gml = true
layers = [
    { key = "naturdenkmale", type_name = "app:Naturdenkmale", reading = "object", object = "natural-monument", name = "text" },
    { key = "landschaftsbestandteile", type_name = "app:geschuetzte_Landschaftsbestandteile", reading = "object", object = "protected-landscape-part", name = "text" },
]

[preview]
wms = "https://dienste.gdi-sh.de/WMS_SH_DOP20col_OpenGBD"
layer = "sh_dop20_rgb"
format = "image/jpeg"
attribution = "© GeoBasis-DE/LVermGeo SH/CC BY 4.0"
agency = "LVermGeo SH"

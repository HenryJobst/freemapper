# Schleswig-Holstein: LVermGeo SH's WFS; rasters from the download portal, whose certificates are pinned, through code.
format = 1

[adapter]
id = "schleswigholstein"
provider = "lvermgeosh"
revision = 3
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DESH"
names = { en = "Schleswig-Holstein", de = "Schleswig-Holstein" }
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-15"

[net]
hosts = ["dienste.gdi-sh.de", "service.gdi-sh.de", "geodaten.schleswig-holstein.de", "umweltgeodienste.schleswig-holstein.de", "opendata.schleswig-holstein.de", "opendata.luebeck.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/schleswig-holstein"
megabytes = 159
label = "Schleswig-Holstein"

[attribution]
licence = "cc-by-4.0"
text = "© GeoBasis-DE/LVermGeo SH/CC BY 4.0 (Quelle verändert)"
note = "Lizenz CC BY 4.0 (Namensnennung 4.0 International): https://creativecommons.org/licenses/by/4.0/"

[alkis]
kind = "wfs"
name = "LVermGeo SH ALKIS"
crs = 25832
url = "https://dienste.gdi-sh.de/WFS_SH_ALKIS_VWG_OpenGBD"
buildings_type = "ave:GebaeudeBauwerk"
land_use_type = "ave:NutzungFlurstueck"
square_bez = "ohne Unterart (Schleswig-Holstein)"

[orthophoto]
backend = "lvermgeo-sh"

[terrain]
backend = "lvermgeo-sh"

[surface]
backend = "lvermgeo-sh"

[[extra.nas]]
name = "LVermGeo SH ATKIS Basis-DLM"
url = "https://dienste.gdi-sh.de/WFS_SH_ATKIS_BDLM_SF_OpenGBD"
model = "basis-dlm"
namespaces = "xmlns(adv,http://www.adv-online.de/namespaces/adv/gid/7.1)"
max_count = 10000
max_bytes = 268435456

[[extra.trees]]
id = "luebeck"
name = "Lübeck tree cadastre"
crs = 25832
envelope = [602000, 5959000, 625000, 5984000]
format = "csv"
x_field = "RECHTSWERT"
y_field = "HOCHWERT"
separator = ";"
endpoints = [
    "https://opendata.luebeck.de/bereich/5.660/stadtgruen/baumkataster/baumkataster.csv",
]
fields = { kind = "GATTUNG", id = "BAUMNUMMER", species = "GA_LANG" }
skipped_kinds = ["Fehlplatz"]
attribution = "Hansestadt Lübeck, Abteilung Grün und Freiräume, Baumkataster, CC0"
max_bytes = 67108864

[preview]
wms = "https://dienste.gdi-sh.de/WMS_SH_DOP20col_OpenGBD"
layer = "sh_dop20_rgb"
format = "image/jpeg"
attribution = "© GeoBasis-DE/LVermGeo SH/CC BY 4.0"
agency = "LVermGeo SH"

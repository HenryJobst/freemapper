# Hamburg: LGV's OGC API with the WFS as fallback, a WMS orthophoto, heights and the flight date through code.
format = 1

[adapter]
id = "hamburg"
provider = "lgv"
revision = 2
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DEHH"
names = { en = "Hamburg", de = "Hamburg" }
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-15"

[net]
hosts = ["api.hamburg.de", "geodienste.hamburg.de", "www.daten-hamburg.de", "archiv.transparenz.hamburg.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/hamburg"
megabytes = 54
label = "Hamburg"

[attribution]
licence = "dl-de/by-2-0"
text = "Freie und Hansestadt Hamburg, Landesbetrieb Geoinformation und Vermessung (LGV) {year}, dl-de/by-2-0, Daten geändert"

[alkis]
kind = "ogc-api-features"
crs = 25832
buildings = "https://api.hamburg.de/datasets/v1/alkis_vereinfacht/collections/GebaeudeBauwerk/items"
land_use = "https://api.hamburg.de/datasets/v1/alkis_vereinfacht/collections/NutzungFlurstueck/items"
normalise = "hamburg-ascii"

[alkis.fallback]
name = "LGV ALKIS (WFS)"
url = "https://geodienste.hamburg.de/WFS_HH_ALKIS_vereinfacht"
buildings_type = "ave:GebaeudeBauwerk"
land_use_type = "ave:NutzungFlurstueck"

[orthophoto]
backend = "lgv"

[terrain]
backend = "lgv"

[surface]
backend = "lgv"

[[extra.trees]]
id = "hamburg-strassenbaeume"
name = "Hamburg street tree cadastre"
crs = 25832
envelope = [548000, 5916000, 589000, 5955000]
format = "ogc-api"
endpoints = [
    "https://api.hamburg.de/datasets/v1/strassenbaumkataster/collections/strassenbaumkataster_hh/items",
]
fields = { kind = "gattung_deutsch", id = "baumid", species = "art_deutsch", crown = "kronendurchmesser" }
attribution = "Freie und Hansestadt Hamburg, Behörde für Umwelt, Klima, Energie und Agrarwirtschaft, dl-de/by-2-0"
max_bytes = 268435456

# The other six services of the Geoportal Hamburg, which had a table in the code (issue #273). Their order is
# that of the sections of the notes.
[[permits.wfs]]
key = "bezirke"
label = { en = "Geoportal Hamburg", de = "Geoportal Hamburg" }
what = { en = "Bezirk borders", de = "Bezirksgrenzen" }
credit = "Datenlizenz Deutschland Namensnennung 2.0, Quellenvermerk: Freie und Hansestadt Hamburg, Landesbetrieb Geoinformation und Vermessung"
sections = ["districts"]
url = "https://geodienste.hamburg.de/HH_WFS_Verwaltungsgrenzen"
output_format = "application/geo%2Bjson"
offices = "hamburg"
layers = [
    { key = "bezirke", type_name = "de.hh.up:bezirke", reading = "district", name = "bezirk_name" },
]

[[permits.wfs]]
key = "gruenanlagen"
label = { en = "Geoportal Hamburg", de = "Geoportal Hamburg" }
what = { en = "list of public green spaces (Grünplan)", de = "Verzeichnis der öffentlichen Grünanlagen (Grünplan)" }
credit = "Datenlizenz Deutschland Namensnennung 2.0, Quellenvermerk: Freie und Hansestadt Hamburg, Behörde für Umwelt und Energie"
sections = ["green-spaces"]
url = "https://geodienste.hamburg.de/HH_WFS_Gruenplan"
output_format = "application/geo%2Bjson"
layers = [
    { key = "gruenanlagen", type_name = "de.hh.up:verzeichnis_oeffentlicher_gruenanlagen", reading = "green-space", name = "benennung", fallback = "gruen_art", district_attribute = "bezirk", districts = ["Hamburg-Mitte", "Altona", "Eimsbüttel", "Hamburg-Nord", "Wandsbek", "Bergedorf", "Harburg"] },
]

[[permits.wfs]]
key = "denkmale"
label = { en = "Geoportal Hamburg", de = "Geoportal Hamburg" }
what = { en = "monuments (Denkmalschutz)", de = "Denkmale (Denkmalschutz)" }
credit = "Datenlizenz Deutschland Namensnennung 2.0, Quellenvermerk: Freie und Hansestadt Hamburg, zuständige Behörde"
sections = ["monuments"]
url = "https://geodienste.hamburg.de/HH_WFS_Denkmalschutz"
output_format = "application/geo%2Bjson"
layers = [
    { key = "gartendenkmale", type_name = "de.hh.up:flaechen_gartendenkmale", reading = "monument", monument = "Gartendenkmal" },
    { key = "ensembles", type_name = "de.hh.up:ensembles", reading = "monument", monument = "Ensemble" },
    { key = "gebaeude", type_name = "de.hh.up:gebaeude", reading = "monument", monument = "Baudenkmal" },
]

[[permits.wfs]]
key = "wald"
label = { en = "Geoportal Hamburg", de = "Geoportal Hamburg" }
what = { en = "forest in Hamburg (Revierförstereien and Bannwald)", de = "Wald in Hamburg (Revierförstereien und Bannwald)" }
credit = "Datenlizenz Deutschland Namensnennung 2.0, Quellenvermerk: Freie und Hansestadt Hamburg, Behörde für Umwelt, Klima, Energie und Agrarwirtschaft (BUKEA)"
sections = ["forest-units", "forest-functions"]
url = "https://geodienste.hamburg.de/HH_WFS_Wald_in_Hamburg"
output_format = "application/geo%2Bjson"
layers = [
    { key = "stadtwald", type_name = "de.hh.up:wald_stadtwald_hamburg", reading = "unit", administration = "Bezirksamt ", administration_attribute = "bezirk", prefix = "Revierförsterei ", office = "foersterei" },
    { key = "bannwald", type_name = "de.hh.up:bannwald_stadtwald_hamburg", reading = "function", function = "protected", name = "name" },
    { key = "bannwald-heuckenlock", type_name = "de.hh.up:bannwald_heuckenlock", reading = "function", function = "protected", name = "name" },
]

[[permits.wfs]]
key = "waldfunktionen"
label = { en = "Geoportal Hamburg", de = "Geoportal Hamburg" }
what = { en = "forest functions (Erholungswald)", de = "Waldfunktionen (Erholungswald)" }
credit = "Datenlizenz Deutschland Namensnennung 2.0, Quellenvermerk: Freie und Hansestadt Hamburg, Behörde für Umwelt, Klima, Energie und Agrarwirtschaft (BUKEA)"
sections = ["forest-functions"]
url = "https://geodienste.hamburg.de/HH_WFS_Waldfunktionen"
output_format = "application/geo%2Bjson"
layers = [
    { key = "erholungswald", type_name = "de.hh.up:waldfunktionen_erholungswald", reading = "function", function = "recreation", name = "erhl_text" },
]

[[permits.wfs]]
key = "wasserschutzgebiete"
label = { en = "Geoportal Hamburg", de = "Geoportal Hamburg" }
what = { en = "water protection areas", de = "Wasserschutzgebiete" }
credit = "Datenlizenz Deutschland Namensnennung 2.0, Quellenvermerk: Freie und Hansestadt Hamburg, Behörde für Umwelt und Energie"
sections = ["water-protection"]
url = "https://geodienste.hamburg.de/HH_WFS_Wasserschutzgebiete"
output_format = "application/geo%2Bjson"
layers = [
    { key = "wasserschutzgebiete", type_name = "de.hh.up:wasserschutzgebiete", reading = "water", name = "gebietsname", zone = "schutzzone", citation = "rechtsgrundlage" },
]

# The protected objects of nature conservation law, read by the table of the Geoportal Hamburg
# (ADR 0146). The source is data since issue #273: a correction of an address needs no release.
[[permits.wfs]]
key = "naturdenkmale"
label = { en = "Geoportal Hamburg", de = "Geoportal Hamburg" }
what = { en = "Naturdenkmale", de = "Naturdenkmale" }
credit = "Datenlizenz Deutschland Namensnennung 2.0, Quellenvermerk: Freie und Hansestadt Hamburg, Behörde für Umwelt und Energie"
sections = ["protected-objects"]
url = "https://geodienste.hamburg.de/HH_WFS_Schutzgebiete"
output_format = "application/geo%2Bjson"
layers = [
    { key = "naturdenkmale", type_name = "de.hh.up:nr_f_naturdenkmal", reading = "object", object = "natural-monument", name = "schutzgebiet", citation = "rechtsgrundlage" },
]

[[permits.wfs]]
key = "biotope"
label = { en = "Geoportal Hamburg", de = "Geoportal Hamburg" }
what = { en = "protected biotopes of the biotope register", de = "geschützte Biotope des Biotopkatasters" }
credit = "Datenlizenz Deutschland Namensnennung 2.0, Quellenvermerk: Freie und Hansestadt Hamburg, Behörde für Umwelt, Klima, Energie und Agrarwirtschaft"
sections = ["protected-objects"]
url = "https://geodienste.hamburg.de/HH_WFS_Biotopkataster"
output_format = "application/geo%2Bjson"
layers = [
    { key = "flaechen", type_name = "de.hh.up:flaechenhafte_biotope_geschuetzt", reading = "object", object = "biotope", name = "paragraf" },
    { key = "punkte", type_name = "de.hh.up:punkthafte_biotope_geschuetzt", reading = "object", object = "biotope", name = "paragraf" },
]

[preview]
wms = "https://geodienste.hamburg.de/wms_dop_zeitreihe_unbelaubt"
layer = "dop_zeitreihe_unbelaubt"
format = "image/jpeg"
params = { time = "2026" }
attribution = "Freie und Hansestadt Hamburg, LGV, dl-de/by-2-0"
agency = "LGV"

# Rhineland-Palatinate: the WFS of LVermGeo RP; rasters from Metalink lists through code.
format = 1

[adapter]
id = "rheinlandpfalz"
provider = "lvermgeorp"
revision = 2
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DERP"
names = { en = "Rhineland-Palatinate", de = "Rheinland-Pfalz" }
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-15"

[net]
hosts = ["geo5.service24.rlp.de", "geo4.service24.rlp.de", "geobasis-rlp.de", "geoportal.bafg.de", "www.geoportal.rlp.de", "geoportal.naturschutz.rlp.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/rheinland-pfalz"
megabytes = 275
label = "Rhineland-Palatinate"

[attribution]
licence = "dl-de/by-2-0"
text = "©GeoBasis-DE / LVermGeoRP{year}, dl-de/by-2-0, www.lvermgeo.rlp.de [Daten bearbeitet]"
note = "Lizenz dl-de/by-2-0 (Datenlizenz Deutschland – Namensnennung – Version 2.0): https://www.govdata.de/dl-de/by-2-0"

[alkis]
kind = "wfs"
name = "LVermGeo RP ALKIS"
crs = 25832
url = "https://geo5.service24.rlp.de/wfs/alkis_rp.fcgi"
buildings_type = "ave:GebaeudeBauwerk"
land_use_type = "ave:Nutzung"
square_bez = "ohne Unterart (Rheinland-Pfalz)"

[orthophoto]
backend = "lvermgeo-rp"

[terrain]
backend = "lvermgeo-rp"

[surface]
backend = "lvermgeo-rp"

[[extra.nas]]
name = "LVermGeo RP Basis-DLM (Shape)"
url = "https://geo5.service24.rlp.de/wfs/basisdlm_shape_rp.fcgi"
model = "basis-dlm"
schema = "shape"
max_count = 100000
max_bytes = 268435456

# The monuments of the GDKE through the geoportal's proxy, GeoJSON in its CRS (with a box in WGS 84 it finds nothing) (issue #273).
[[permits.wfs]]
key = "denkmale"
label = { en = "Generaldirektion Kulturelles Erbe", de = "Generaldirektion Kulturelles Erbe" }
what = { en = "Einzeldenkmäler, Denkmalzonen, bauliche Gesamtanlagen", de = "Einzeldenkmäler, Denkmalzonen, bauliche Gesamtanlagen" }
credit = "Datenlizenz Deutschland – Namensnennung – Version 2.0 (dl-de/by-2-0); Quellenvermerk: GDKE RLP"
sections = ["monuments"]
url = "https://www.geoportal.rlp.de/owsproxy/00000000000000000000000000000000/a2e0fb04feed3a72cf42d53cf6e2165e"
output_format = "application/json"
native_crs = 25832
layers = [
    { key = "punkte", type_name = "gdke:edm_punkte", reading = "monument", monument = "Einzeldenkmal" },
    { key = "flaechen", type_name = "gdke:edm_flaechen", reading = "monument", monument = "Einzeldenkmal" },
    { key = "denkmalzonen", type_name = "gdke:denkmalzonen", reading = "monument", monument = "Denkmalzone" },
    { key = "gesamtanlagen", type_name = "gdke:bga", reading = "monument", monument = "Bauliche Gesamtanlage" },
]

# The Naturdenkmale and geschützte Landschaftsbestandteile of the LfU's nature conservation service
# (one WFS per topic, ODbL), issue #273. Its biotope mapping holds the unprotected biotopes too and
# stays out.
[[permits.wfs]]
key = "naturdenkmale"
label = { en = "Landesamt für Umwelt Rheinland-Pfalz", de = "Landesamt für Umwelt Rheinland-Pfalz" }
what = { en = "Naturdenkmale", de = "Naturdenkmale" }
credit = "Landesamt für Umwelt Rheinland-Pfalz; Nutzung entsprechend den Lizenzbestimmungen der Open Database License (ODbL) mit Quellenangabe"
sections = ["protected-objects"]
url = "https://geoportal.naturschutz.rlp.de/kartendienst_naturschutz/apps/service/wfs_getmap.php?mapfile=naturdenkmale"
output_format = "application/json;%20subtype=geojson"
layers = [
    { key = "naturdenkmale", type_name = "ms:naturdenkmale", reading = "object", object = "natural-monument", name = "bezeichnung", citation = "rvolink" },
]

[[permits.wfs]]
key = "landschaftsbestandteile"
label = { en = "Landesamt für Umwelt Rheinland-Pfalz", de = "Landesamt für Umwelt Rheinland-Pfalz" }
what = { en = "geschützte Landschaftsbestandteile", de = "geschützte Landschaftsbestandteile" }
credit = "Landesamt für Umwelt Rheinland-Pfalz; Nutzung entsprechend den Lizenzbestimmungen der Open Database License (ODbL) mit Quellenangabe"
sections = ["protected-objects"]
url = "https://geoportal.naturschutz.rlp.de/kartendienst_naturschutz/apps/service/wfs_getmap.php?mapfile=glb"
output_format = "application/json;%20subtype=geojson"
layers = [
    { key = "landschaftsbestandteile", type_name = "ms:glb", reading = "object", object = "protected-landscape-part", name = "bezeichnung", citation = "rvolink" },
]

[preview]
wms = "https://geo4.service24.rlp.de/wms/rp_dop20.fcgi"
layer = "rp_dop20"
format = "image/jpeg"
attribution = "©GeoBasis-DE / LVermGeoRP{year}, dl-de/by-2-0, www.lvermgeo.rlp.de"
agency = "LVermGeo RP"

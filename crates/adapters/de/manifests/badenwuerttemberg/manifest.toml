# Baden-Württemberg: the rasters of the LGL through code (a WMS orthophoto dated by a WFS of the
# flight tiles, heights out of the 2 km archives of the file server). Its ALKIS WFS serves
# GeoServer views that are not the simplified schema, so the ALKIS is code as well.
format = 1

[adapter]
id = "badenwuerttemberg"
provider = "lglbw"
revision = 1
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DEBW"
names = { en = "Baden-Württemberg", de = "Baden-Württemberg" }
agency = "LGL"
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-13"

[net]
hosts = ["owsproxy.lgl-bw.de", "opengeodata.lgl-bw.de", "rips-gdi.lubw.baden-wuerttemberg.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/baden-wuerttemberg/freiburg-regbez"
megabytes = 160.5
label = "Baden-Württemberg, Freiburg"
boundary = "osm-freiburg.geojson"
cache_prefix = "bw-freiburg"

[[osm.extract]]
geofabrik = "europe/germany/baden-wuerttemberg/karlsruhe-regbez"
megabytes = 155.3
label = "Baden-Württemberg, Karlsruhe"
boundary = "osm-karlsruhe.geojson"
cache_prefix = "bw-karlsruhe"

[[osm.extract]]
geofabrik = "europe/germany/baden-wuerttemberg/stuttgart-regbez"
megabytes = 212.5
label = "Baden-Württemberg, Stuttgart"
boundary = "osm-stuttgart.geojson"
cache_prefix = "bw-stuttgart"

[[osm.extract]]
geofabrik = "europe/germany/baden-wuerttemberg/tuebingen-regbez"
megabytes = 128.6
label = "Baden-Württemberg, Tübingen"
boundary = "osm-tuebingen.geojson"
cache_prefix = "bw-tuebingen"

[attribution]
licence = "dl-de/by-2-0"
text = "Datenquelle: LGL, www.lgl-bw.de, dl-de/by-2-0 (Daten geändert, {year})"
note = "Lizenz dl-de/by-2-0 (Datenlizenz Deutschland – Namensnennung – Version 2.0): https://www.govdata.de/dl-de/by-2-0"

[orthophoto]
backend = "lgl-bw"

[terrain]
backend = "lgl-bw"

[surface]
backend = "lgl-bw"

# The two WFS of the Landesamt für Denkmalpflege behind the LGL's proxy; the type names go without their prefix (issue #273).
[[permits.wfs]]
key = "denkmale"
label = { en = "Landesamt für Denkmalpflege Baden-Württemberg", de = "Landesamt für Denkmalpflege Baden-Württemberg" }
what = { en = "Kulturdenkmale and Gesamtanlagen", de = "Kulturdenkmale und Gesamtanlagen" }
credit = "Es gelten die Lizenzbedingungen „Datenlizenz Deutschland -Namensnennung -Version 2.0“ bzw. „dl-de/by-2-0” (https://www.govdata.de/dl-de/by-2-0) mit Angabe der Datenquelle: dl-de/by-2-0: Landesamt für Denkmalpflege im Regierungspräsidium Stuttgart, www.denkmalpflege-bw.de"
sections = ["monuments"]
url = "https://owsproxy.lgl-bw.de/owsproxy/wfs/WFS_LAD_Kulturdenkmale_Bau_Kunstdenkmalpflege"
output_format = "application/json"
layers = [
    { key = "kulturdenkmale", type_name = "v_bau_kunstdenkmalpflege_kulturdenkmale", reading = "monument", monument = "Kulturdenkmal" },
    { key = "gesamtanlagen", type_name = "v_bau_kunstdenkmalpflege_gesamtanlagen", reading = "monument", monument = "Gesamtanlage" },
]

[[permits.wfs]]
key = "archaeologie"
label = { en = "Landesamt für Denkmalpflege Baden-Württemberg", de = "Landesamt für Denkmalpflege Baden-Württemberg" }
what = { en = "archaeological monuments and Grabungsschutzgebiete", de = "archäologische Kulturdenkmale und Grabungsschutzgebiete" }
credit = "Es gelten die Lizenzbedingungen „Datenlizenz Deutschland -Namensnennung -Version 2.0“ bzw. „dl-de/by-2-0” (https://www.govdata.de/dl-de/by-2-0) mit Angabe der Datenquelle: dl-de/by-2-0: Landesamt für Denkmalpflege im Regierungspräsidium Stuttgart, www.denkmalpflege-bw.de"
sections = ["monuments"]
url = "https://owsproxy.lgl-bw.de/owsproxy/wfs/WFS_LAD_Archaeologische_Kulturdenkmale_BW"
output_format = "application/json"
layers = [
    { key = "kulturdenkmale", type_name = "v_archaeologie_kulturdenkmale", reading = "monument", monument = "Archäologisches Kulturdenkmal" },
    { key = "grabungsschutzgebiete", type_name = "v_archaeologie_grabungsschutzgebiete", reading = "monument", monument = "Grabungsschutzgebiet" },
]

# The Naturdenkmale of the LUBW, single ones and areas (issue #273). The biotopes stay out: their
# terms of use need a request for any commercial use.
[[permits.wfs]]
key = "naturdenkmale"
label = { en = "LUBW", de = "LUBW" }
what = { en = "Naturdenkmale, single", de = "Naturdenkmale, Einzelgebilde" }
credit = "Grundlage: Daten aus dem Umweltinformationssystem (UIS) der LUBW Landesanstalt für Umwelt Baden-Württemberg"
sections = ["protected-objects"]
url = "https://rips-gdi.lubw.baden-wuerttemberg.de/arcgis/services/wfs/Naturdenkmal_Einzelgebilde/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "naturdenkmale", type_name = "Naturdenkmal_Einzelgebilde", reading = "object", object = "natural-monument", name = "OBJEKT" },
]

[[permits.wfs]]
key = "flaechennaturdenkmale"
label = { en = "LUBW", de = "LUBW" }
what = { en = "Naturdenkmale, areas", de = "Naturdenkmale, flächenhaft" }
credit = "Grundlage: Daten aus dem Umweltinformationssystem (UIS) der LUBW Landesanstalt für Umwelt Baden-Württemberg"
sections = ["protected-objects"]
url = "https://rips-gdi.lubw.baden-wuerttemberg.de/arcgis/services/wfs/Naturdenkmal_Flaechenhaft/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "naturdenkmale", type_name = "Naturdenkmal_Flaechenhaft", reading = "object", object = "natural-monument", name = "OBJEKT" },
]

[preview]
wms = "https://owsproxy.lgl-bw.de/owsproxy/ows/WMS_LGL-BW_ATKIS_DOP_20_C"
layer = "IMAGES_DOP_20_RGB"
format = "image/jpeg"
attribution = "Datenquelle: LGL, www.lgl-bw.de, dl-de/by-2-0"
agency = "LGL"

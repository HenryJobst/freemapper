# Saxony: GeoSN's WFS, tiles of 2 km and the orthophoto through code.
format = 1

[adapter]
id = "saxony"
provider = "geosn"
revision = 2
min_freemapper = "0.13.0"
crs = 25833
object_id_prefix = "DESN"
names = { en = "Saxony", de = "Sachsen" }
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-15"

[net]
hosts = ["geodienste.sachsen.de", "geocloud.landesvermessung.sachsen.de", "www.forsten.sachsen.de", "geoportal.bafg.de", "cardomap3.idu.de", "luis.sachsen.de", "geodienste.leipzig.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/sachsen"
megabytes = 270
label = "Saxony"

[attribution]
licence = "dl-de/by-2-0"
text = "Quelle: GeoSN, dl-de/by-2-0, Daten geändert"

[alkis]
kind = "wfs"
name = "GeoSN ALKIS"
crs = 25833
url = "https://geodienste.sachsen.de/aaa/public_alkis/vereinf/wfs"
buildings_type = "ave:GebaeudeBauwerk"
land_use_type = "ave:NutzungFlurstueck"
square_bez = "ohne Unterart (Sachsen)"

[orthophoto]
backend = "geosn"

[terrain]
backend = "geosn"

[surface]
backend = "geosn"

[[extra.trees]]
id = "leipzig"
name = "Leipzig tree cadastre"
crs = 25833
envelope = [307000, 5680000, 329000, 5703000]
format = "wfs-geojson"
type_name = "OpenData:Baeume"
output_format = "application/json"
endpoints = [
    "https://geodienste.leipzig.de/l3/OpenData/Baeume/wfs",
]
fields = { kind = "gattung", id = "baumnummer", species = "ga_lang_deutsch", crown = "kr_durchm", gone = "gefaellt_am" }
attribution = "Stadt Leipzig, Baumkataster, dl-de/by-2-0"
max_bytes = 268435456

[preview]
wms = "https://geodienste.sachsen.de/wms_geosn_dop-rgb/guest"
layer = "sn_dop_020"
format = "image/jpeg"
attribution = "Quelle: GeoSN, dl-de/by-2-0"
agency = "GeoSN"

# Saxony: GeoSN's WFS, tiles of 2 km and the orthophoto through code.
format = 1

[adapter]
id = "saxony"
provider = "geosn"
revision = 2
min_freemapper = "0.13.0"
crs = 25833
object_id_prefix = "DESN"
names = { en = "Saxony", de = "Sachsen" }
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-15"

[net]
hosts = ["geodienste.sachsen.de", "geocloud.landesvermessung.sachsen.de", "www.forsten.sachsen.de", "geoportal.bafg.de", "cardomap3.idu.de", "luis.sachsen.de", "geodienste.leipzig.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/sachsen"
megabytes = 270
label = "Saxony"

[attribution]
licence = "dl-de/by-2-0"
text = "Quelle: GeoSN, dl-de/by-2-0, Daten geändert"

[alkis]
kind = "wfs"
name = "GeoSN ALKIS"
crs = 25833
url = "https://geodienste.sachsen.de/aaa/public_alkis/vereinf/wfs"
buildings_type = "ave:GebaeudeBauwerk"
land_use_type = "ave:NutzungFlurstueck"
square_bez = "ohne Unterart (Sachsen)"

[orthophoto]
backend = "geosn"
url = "https://geodienste.sachsen.de/wms_geosn_dop-rgb/guest"
layer = "sn_dop_020"
max_px = 4000

[terrain]
backend = "geosn"

[surface]
backend = "geosn"

[[extra.trees]]
id = "leipzig"
name = "Leipzig tree cadastre"
crs = 25833
envelope = [307000, 5680000, 329000, 5703000]
format = "wfs-geojson"
type_name = "OpenData:Baeume"
output_format = "application/json"
endpoints = [
    "https://geodienste.leipzig.de/l3/OpenData/Baeume/wfs",
]
fields = { kind = "gattung", id = "baumnummer", species = "ga_lang_deutsch", crown = "kr_durchm", gone = "gefaellt_am" }
attribution = "Stadt Leipzig, Baumkataster, dl-de/by-2-0"
max_bytes = 268435456

# The Kulturdenkmale of the Landesamt für Denkmalpflege Sachsen (cardo), GML 3.2, as areas and as points (issue #273).
[[permits.wfs]]
key = "denkmale"
label = { en = "Landesamt für Denkmalpflege Sachsen", de = "Landesamt für Denkmalpflege Sachsen" }
what = { en = "Kulturdenkmale", de = "Kulturdenkmale" }
credit = "Landesamt für Denkmalpflege Sachsen, Creative Commons Namensnennung 3.0 Deutschland (CC BY 3.0 DE)"
sections = ["monuments"]
url = "https://cardomap3.idu.de/lfds/public/ogc.ashx?PKGID=5"
output_format = "application%2Fgml%2Bxml%3B%20version%3D3.2"
gml = true
layers = [
    { key = "flaechen", type_name = "cls:L1", reading = "monument", monument = "Kulturdenkmal" },
    { key = "punkte", type_name = "cls:L3", reading = "monument", monument = "Kulturdenkmal" },
]

# The Flächennaturdenkmale and the register of the protected biotopes of the LfULG (issue #273).
# The Naturdenkmale that are single trees or rocks are kept by the Landkreise.
[[permits.wfs]]
key = "naturdenkmale"
label = { en = "Sächsisches Landesamt für Umwelt, Landwirtschaft und Geologie", de = "Sächsisches Landesamt für Umwelt, Landwirtschaft und Geologie" }
what = { en = "Flächennaturdenkmale", de = "Flächennaturdenkmale" }
credit = "Datenlizenz Deutschland 2.0 - Variante mit Namensnennung; Quelle: Sächsisches Landesamt für Umwelt, Landwirtschaft und Geologie"
gaps = { en = "Naturdenkmale that are single trees or rocks are kept by the Landkreise and are not in these data", de = "Naturdenkmale, die einzelne Bäume oder Felsen sind, führen die Landkreise; sie fehlen hier" }
sections = ["protected-objects"]
url = "https://luis.sachsen.de/arcgis/services/natur/schutzgebiete/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "naturdenkmale", type_name = "schutzgebiete:Flaechennaturdenkmaeler", reading = "object", object = "natural-monument", name = "NAME" },
]

[[permits.wfs]]
key = "biotope"
label = { en = "Sächsisches Landesamt für Umwelt, Landwirtschaft und Geologie", de = "Sächsisches Landesamt für Umwelt, Landwirtschaft und Geologie" }
what = { en = "register of the legally protected biotopes", de = "Verzeichnis der gesetzlich geschützten Biotope" }
credit = "Datenlizenz Deutschland 2.0 - Variante mit Namensnennung; Quelle: Sächsisches Landesamt für Umwelt, Landwirtschaft und Geologie"
sections = ["protected-objects"]
url = "https://luis.sachsen.de/arcgis/services/natur/gesetz_gesch_biotope/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "flaechen", type_name = "gesetz_gesch_biotope:BTPVZ_f_neu", reading = "object", object = "biotope", name = "BTTP26_BEZ" },
    { key = "punkte", type_name = "gesetz_gesch_biotope:BTPVZ_p_neu", reading = "object", object = "biotope", name = "BTTP26_BEZ" },
]

# The two WMS of the Staatsbetrieb Sachsenforst, asked at points (issue #273, ADR 0139): "Wald nach SächsWaldG" gives the Revier
# and the Forstbezirk at a point, "Waldfunktionen in Sachsen" the functions of the forest there. The layers of the functions
# are Erholungswald (7), Naturwaldzelle (46), Bodenschutzwald nach SächsWaldG (101) and the zones of the drinking water
# protection areas of reservoirs (80 to 84), streams (86 to 88) and ground water (90 to 94). A Revier is in charge in the
# state forest; the Reviere write the name of the national park's office in 40 characters, which cuts it.
[[permits.getfeatureinfo]]
key = "sachsenforst"
label = { en = "Staatsbetrieb Sachsenforst", de = "Staatsbetrieb Sachsenforst" }
what = { en = "Forstbezirke and Reviere (in charge in the state forest; for other forest the lower forest authority of the Landkreis), Erholungswald, Naturwaldzellen, Bodenschutzwald, drinking water protection zones in the forest", de = "Forstbezirke und Reviere (zuständig im Staatswald; für anderen Wald die untere Forstbehörde des Landkreises), Erholungswald, Naturwaldzellen, Bodenschutzwald, Trinkwasserschutzzonen im Wald" }
credit = "Datenlizenz Deutschland 2.0 – Namensnennung (dl-de/by-2-0) unter Angabe der Quelle: \"Geodaten Sachsenforst\""
sections = ["forest-units", "forest-functions", "water-protection"]
layers = [
    { key = "reviere", url = "https://www.forsten.sachsen.de/kartendienste/wald/MapServer/WMSServer", wms_layers = "Reviere", one = true, reading = "unit", administration = "Staatsbetrieb Sachsenforst", prefix = "Forstbezirk ", office = "FBZ_NAME", unit_attribute = "REV_NAME", unit_prefix = "Revier ", office_renames = [{ starts_with = "Nationalpark", name = "Nationalpark- und Forstverwaltung Sächsische Schweiz" }] },
    { key = "waldfunktionen", url = "https://www.forsten.sachsen.de/kartendienste/waldfunktionen/MapServer/WMSServer", wms_layers = "7,46,101,80,81,82,83,84,86,87,88,90,91,92,93,94", reading = "function-code", code_attribute = "WFZ", name = "GNM", codes = [{ code = "7110", function = "recreation" }, { code = "4151", function = "natural" }, { code = "1110", function = "protected", label = "Bodenschutzwald" }], water_prefix = "211", water_length = 5, zone = "KNM", zone_after = " Z " },
]

[preview]
wms = "https://geodienste.sachsen.de/wms_geosn_dop-rgb/guest"
layer = "sn_dop_020"
format = "image/jpeg"
attribution = "Quelle: GeoSN, dl-de/by-2-0"
agency = "GeoSN"

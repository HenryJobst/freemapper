# Saarland: the WFS of the geoportal for ALKIS (an ArcGIS server: upper-case attribute names, no
# SORTBY), a WMS orthophoto, heights from the district archives of the open-data share through code,
# and the forest road network of the forest administration (ADR 0155) as candidates of the forest map.
format = 1

[adapter]
id = "saarland"
provider = "lvgl"
revision = 2
min_freemapper = "0.13.0"
crs = 25832
object_id_prefix = "DESL"
names = { en = "Saarland", de = "Saarland" }
agency = "LVGL"
maintainers = ["github:HenryJobst"]
last_verified = "2026-11-16"

[net]
hosts = ["geoportal.saarland.de", "www.shop.lvgl.saarland.de"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/saarland"
megabytes = 53
label = "Saarland"

[attribution]
licence = "dl-de/by-2-0"
text = "© GeoBasis DE/LVGL-SL ({year}), dl-de/by-2-0, Daten geändert; Forstwegenetz © GDI-SL, CC BY 4.0, Daten geändert"
note = "Lizenz dl-de/by-2-0 (Datenlizenz Deutschland – Namensnennung – Version 2.0): https://www.govdata.de/dl-de/by-2-0. Das Forstwegenetz (GDI-SL) steht laut Katalog unter CC BY 4.0: https://creativecommons.org/licenses/by/4.0/deed.de"

[alkis]
kind = "wfs"
name = "LVGL ALKIS"
crs = 25832
url = "https://geoportal.saarland.de/registry/wfs/414"
buildings_type = "ALKIS_ALKIS_WFS_ohne_Eig:GebaeudeBauwerk"
land_use_type = "ALKIS_ALKIS_WFS_ohne_Eig:Nutzung"
square_bez = "ohne Unterart (Saarland)"
sorted = false

# The forest road network (ADR 0155): the catalogue says CC BY 4.0 with the credit "© GDI-SL", the
# capabilities say "Es gelten keine Bedingungen"; the stricter one is credited. Machine roads and
# skidding lanes are no paths and stay out; the others become tracks and footpaths of the forest map.
[[extra.nas]]
name = "LVGL Forstwegenetz"
url = "https://geoportal.saarland.de/arcgis/services/Internet/Forstwirtschaft/MapServer/WFSServer"
model = "basis-dlm"
schema = "forest-roads"
type_name = "Forstwirtschaft:Forstwegenetz"
layers = ["dlm-fahrweg", "dlm-weg"]
max_count = 20000
max_bytes = 67108864

# The three services of the Geoportal Saarland that had a table in the code (issue #273): the Reviere of the
# SaarForst, water protection areas with Naturwaldzellen and Urwald, and the Baudenkmale.
[[permits.wfs]]
key = "forst"
label = { en = "Geoportal Saarland", de = "Geoportal Saarland" }
what = { en = "forest districts of the SaarForst Landesbetrieb (state forest)", de = "Reviere des SaarForst Landesbetriebs (Staatswald)" }
credit = "Quellenvermerk: © GDI-SL ({year}); Lizenz: Creative Commons Namensnennung 4.0 International (CC BY 4.0)"
sections = ["forest-units"]
url = "https://geoportal.saarland.de/arcgis/services/Internet/Forstwirtschaft/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "reviere", type_name = "Forstwirtschaft:Reviergrenze_Staatswald", reading = "unit", administration = "SaarForst Landesbetrieb", prefix = "Revier ", office = "NAME" },
]

[[permits.wfs]]
key = "schutzgebiete"
label = { en = "Geoportal Saarland", de = "Geoportal Saarland" }
what = { en = "water protection areas, Naturwaldzellen and Urwald", de = "Wasserschutzgebiete, Naturwaldzellen und Urwald" }
credit = "Quellenvermerk: © GDI-SL ({year}); Lizenz: Creative Commons Namensnennung 4.0 International (CC BY 4.0)"
sections = ["water-protection", "forest-functions"]
url = "https://geoportal.saarland.de/arcgis/services/Internet/Schutzgebiete_INS/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "wasserschutzgebiete", type_name = "Schutzgebiete_INS:Wasserschutzgebiet", reading = "water", name = "NAME", zone = "SCHUTZZONE", citation = "RECHTSGRUNDLAGE" },
    { key = "naturwaldzellen", type_name = "Schutzgebiete_INS:Naturwaldzellen", reading = "function", function = "natural", name = "NWZ" },
    { key = "urwald", type_name = "Schutzgebiete_INS:Urwald_SL", reading = "function", function = "natural", name = "INFO" },
]

[[permits.wfs]]
key = "denkmale"
label = { en = "Geoportal Saarland", de = "Geoportal Saarland" }
what = { en = "listed buildings (Baudenkmale)", de = "Baudenkmale" }
credit = "Quellenvermerk: © GDI-SL ({year}); Lizenz: Creative Commons Namensnennung 4.0 International (CC BY 4.0)"
sections = ["monuments"]
url = "https://geoportal.saarland.de/arcgis/services/Internet/Denkmalschutz/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "baudenkmale", type_name = "Denkmalschutz:Baudenkmale", reading = "monument", monument = "Baudenkmal", link_attribute = "Baud_Land", link_prefix = "https://www.saarland.de/" },
]

# The protected objects of the Geoportal Saarland (issue #273). The geschützte Landschaftsbestandteile
# stay out: one ordinance among them was found invalid, and the table does not mark which.
[[permits.wfs]]
key = "naturdenkmale"
label = { en = "Geoportal Saarland", de = "Geoportal Saarland" }
what = { en = "Naturdenkmale", de = "Naturdenkmale" }
credit = "Quellenvermerk: © GDI-SL ({year}); Lizenz: Creative Commons Namensnennung 4.0 International (CC BY 4.0)"
sections = ["protected-objects"]
url = "https://geoportal.saarland.de/arcgis/services/Internet/Schutzgebiete_INS/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "naturdenkmale", type_name = "Naturdenkmal_Flaechen", reading = "object", object = "natural-monument", name = "NAME", citation = "RECHTSGR" },
]

[[permits.wfs]]
key = "biotope"
label = { en = "Geoportal Saarland", de = "Geoportal Saarland" }
what = { en = "protected biotopes of the biotope register", de = "geschützte Biotope des Biotopkatasters" }
credit = "Quellenvermerk: © GDI-SL ({year}); Lizenz: Creative Commons Namensnennung 4.0 International (CC BY 4.0)"
sections = ["protected-objects"]
url = "https://geoportal.saarland.de/arcgis/services/Internet/Biotopkataster/MapServer/WFSServer"
output_format = "GEOJSON"
layers = [
    { key = "biotope", type_name = "Geschuetzte_Biotope_f", reading = "object", object = "biotope", name = "BEZEICHNUNG" },
]

[orthophoto]
backend = "lvgl"

[terrain]
backend = "lvgl"

[surface]
backend = "lvgl"

# The point clouds the vegetation candidates are read from (issue #273): the backend of the state keeps the names of the
# tiles and how it reads the answers, the manifest holds where.
[point_cloud]
kind = "zip-archives"
url = "https://www.shop.lvgl.saarland.de/cloud/public.php/dav/files/NK8ndP55qAqGEZD/OD_LIDAR_Punktwolke_2025_laz_LK"

[preview]
wms = "https://geoportal.saarland.de/freewms/dop2025"
layer = "sl_dop20_rgb"
format = "image/jpeg"
attribution = "© GeoBasis DE/LVGL-SL, dl-de/by-2-0"
agency = "LVGL"

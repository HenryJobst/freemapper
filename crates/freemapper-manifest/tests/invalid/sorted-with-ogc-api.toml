# expect: manifest.unknown-key
# `sorted` belongs to kind wfs: an OGC API has no SORTBY
format = 1

[adapter]
id = "sample"
revision = 1
min_freemapper = "0.13.0"
crs = 25832
names = { en = "Sample", de = "Beispiel" }

[net]
hosts = ["geo.example.org"]

[boundary]
file = "boundary.geojson"
crs = 25833

[[osm.extract]]
geofabrik = "europe/germany/hamburg"
megabytes = 54
label = "Sample"

[attribution]
licence = "dl-de/by-2-0"
text = "© Sample {year}, dl-de/by-2-0"

[alkis]
kind = "ogc-api-features"
buildings = "https://geo.example.org/alkis/buildings/items"
land_use = "https://geo.example.org/alkis/landuse/items"
sorted = false

[orthophoto]
kind = "wms"
url = "https://geo.example.org/dop/wms"
layer = "dop20"
max_px = 4000

[terrain]
kind = "wcs"
url = "https://geo.example.org/dgm/wcs"
coverage = "dgm1"
envelope = [600000, 5600000, 700000, 5700000]
max_m = 4000

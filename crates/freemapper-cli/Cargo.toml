[package]
name = "freemapper-cli"
description = "Command line interface and MCP server of freemapper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "freemapper"
path = "src/main.rs"

[features]
# Tests only: a debug build with this feature takes FREEMAPPER_UPDATE_TEST_BASE, counts as a release
# build and sends its update requests to that stub server (`cargo test -p freemapper-cli --features
# test-stub`). Release builds never have it.
test-stub = []

[dependencies]
freemapper.workspace = true
freemapper-fs.workspace = true
freemapper-update.workspace = true
freemapper-web.workspace = true
freemapper-text.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
chrono.workspace = true
base64.workspace = true
dirs.workspace = true
rmcp.workspace = true
rust-embed.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ureq.workspace = true

[dev-dependencies]
minisign-verify.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true

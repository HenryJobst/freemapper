# OSM tags → symbols for templates/candidates.omap and the map itself (spec §4.5).
#
# The first rule whose conditions and geometry match a feature decides; a map kind without a
# symbol code skips the feature. Conditions in `when` must all hold: `key=value`, `key=a|b`
# (alternatives), `key=*` (any value) or `key!=value` (absent or another value); at least one
# condition must not be negated.
#
# A condition `key<number` holds when the value is a number below it (`1,2 m` reads as 1.2).
#
# `target`: `candidates` (default; templates/candidates.omap) or `map` (reliable enough to be a map
# object, "Sicheres fertig, Rest Vorlage").
#
# `draw`: `point` (nodes), `line` (ways; with `point_as_short_line_mm` also nodes, drawn as a
# short horizontal line of that length on paper for the mapper to rotate), `area` (closed ways).
# `corridor_m`: with `draw = "line"`, a way becomes an area, a strip along it of this width in
# metres (its `width` tag if it has one; 1.5 to 12 m). The symbol must be an area symbol.
#
# Codes refer to ISSprOM 2019 and the IOF school symbol set 2019.

# Underground hydrants are not visible on the ground.
[[rule]]
when = ["emergency=fire_hydrant", "fire_hydrant:type!=underground"]
draw = "point"
schoolyard = "321"

# Control sites for course setters (sprint only, candidates only, ADR 0074): bollards, street lamps,
# waste baskets, bicycle racks and benches are good control locations, but a sprint map does not
# draw them. ISSprOM 4.5, 531 "Prominent man-made feature - x": "a man-made feature which is
# significant or prominent. The definition of the symbol must be given on the map." Each carries
# `freemapper:control=<kind>`. `build/control_sites.rs` drops the ones in a row or a pair, and
# `build/points.rs` keeps the gap between the symbols.
[[rule]]
when = ["amenity=bench"]
draw = "point"
sprint = "531"

[[rule]]
when = ["amenity=bench"]
draw = "line"
point_as_short_line_mm = 1.5
schoolyard = "543"

# Memorials (sprint only, candidates only, ADR 0075). ISSprOM 4.5, 526 "Cairn, memorial, small
# monument or boundary stone that is obvious". What is flush with the ground or hangs on a wall is
# not obvious: Stolpersteine (the census found 118 in two small boxes), plaques and plates, and
# memorials that are a bench, a tree, a mural or a ghost bike. Only nodes: an area memorial is a
# building (521) or a 521 mapper job.
[[rule]]
when = ["historic=memorial|monument|wayside_cross|boundary_stone", "memorial!=stolperstein|stolperschwelle|plaque|plate|ground_plaque|blue_plaque|bench|ghost_bike|mural|tree", "memorial:type!=stolperstein|stolperschwelle|plaque"]
draw = "point"
sprint = "526"

[[rule]]
when = ["barrier=bollard"]
draw = "point"
sprint = "531"

[[rule]]
when = ["amenity=waste_basket"]
draw = "point"
sprint = "531"

[[rule]]
when = ["amenity=bicycle_parking"]
draw = "point"
sprint = "531"

[[rule]]
when = ["leisure=picnic_table"]
draw = "point"
schoolyard = "542"

[[rule]]
when = ["amenity=table"]
draw = "point"
schoolyard = "542"

[[rule]]
when = ["highway=street_lamp"]
draw = "point"
schoolyard = "545"
sprint = "531"

[[rule]]
when = ["man_made=flagpole|mast"]
draw = "point"
schoolyard = "544"

[[rule]]
when = ["playground=*"]
draw = "line"
point_as_short_line_mm = 1.8
schoolyard = "541"

[[rule]]
when = ["natural=tree"]
draw = "point"
schoolyard = "418"
sprint = "418"

[[rule]]
when = ["barrier=hedge"]
draw = "line"
schoolyard = "410.1"
sprint = "410.1"

[[rule]]
when = ["barrier=wall"]
draw = "line"
schoolyard = "515"
sprint = "515"

[[rule]]
when = ["barrier=retaining_wall"]
draw = "line"
schoolyard = "513.2"
sprint = "513.2"

[[rule]]
when = ["barrier=fence"]
draw = "line"
schoolyard = "518"
sprint = "518"

[[rule]]
when = ["natural=cliff"]
draw = "line"
schoolyard = "201"
sprint = "201"

# Private areas (sprint only, ADR 0073). ISSprOM 4.5, 520: "An area that shall not be entered such
# as a private area, a flower bed, a railway area etc." `access=private|no` on a land use, leisure or
# amenity area; the area rules below (pitch, park, grass) would give it a ground symbol. Water keeps
# its rule: a private pool or pond is still water.
[[rule]]
when = ["landuse=*", "landuse!=reservoir|basin", "access=private|no"]
draw = "area"
sprint = "520"

[[rule]]
when = ["leisure=garden|pitch|playground|sports_centre|golf_course|track|stadium|park|recreation_ground|dog_park|miniature_golf|horse_riding|ice_rink", "access=private|no"]
draw = "area"
sprint = "520"

[[rule]]
when = ["amenity=parking|school|kindergarten|childcare|college|university|hospital|grave_yard|social_facility|fuel|car_wash|marketplace", "access=private|no"]
draw = "area"
sprint = "520"

[[rule]]
when = ["leisure=pitch|track", "surface=tartan|asphalt|concrete"]
draw = "area"
schoolyard = "501.10"
sprint = "501.10"

[[rule]]
when = ["leisure=pitch", "surface=grass"]
draw = "area"
schoolyard = "401"
sprint = "401"

# Parks, lawns and meadows: open land (401) candidates. Where an ALKIS park, meadow or wood is a map
# object, the OSM area adds nothing and goes (`build/open_land.rs`, ADR 0069).
[[rule]]
when = ["leisure=park"]
draw = "area"
schoolyard = "401"
sprint = "401"

[[rule]]
when = ["landuse=grass|meadow|village_green|recreation_ground"]
draw = "area"
schoolyard = "401"
sprint = "401"

# Closed ways (sprint only, ADR 0073): a private or closed way is no path to run on but part of an
# area that shall not be entered (ISSprOM 4.5, 520). The way is the centre line, the strip along it
# (2 m for footways, 3 m for service roads and tracks, or the `width` tag) the candidate. `foot=yes`,
# `permissive` or `designated` lets a runner in. `access=destination|customers|permit` is not
# closed. A cycleway or service road with only `foot=no` is a road a runner can cross.
[[rule]]
when = ["highway=footway|path|pedestrian|steps|bridleway", "access=private|no", "foot!=yes|permissive|designated", "area!=yes", "indoor!=yes"]
draw = "line"
corridor_m = 2.0
sprint = "520"

[[rule]]
when = ["highway=footway|path|pedestrian|steps|bridleway", "foot=private|no", "area!=yes", "indoor!=yes"]
draw = "line"
corridor_m = 2.0
sprint = "520"

[[rule]]
when = ["highway=service|track|cycleway", "access=private|no", "foot!=yes|permissive|designated", "area!=yes", "indoor!=yes"]
draw = "line"
corridor_m = 3.0
sprint = "520"

[[rule]]
when = ["highway=service|track|cycleway", "foot=private", "area!=yes", "indoor!=yes"]
draw = "line"
corridor_m = 3.0
sprint = "520"

# Passages through buildings and arcades (sprint only, ADR 0072). ISSprOM 4.5, 522 canopy: "a
# building construction (with a roof), normally supported by pillars, poles or walls, such as
# passages, gangways, courts". The way is the centre line, the strip along it the candidate; the
# building stays whole (as for the ALKIS passages, ADR 0061). The surface does not matter: a
# passage decides routes whether it is paved or not. Real tunnels and indoor ways are no passage.
[[rule]]
when = ["highway=*", "tunnel=building_passage", "indoor!=yes", "area!=yes"]
draw = "line"
corridor_m = 3.0
sprint = "522"

[[rule]]
when = ["highway=footway|path|pedestrian|cycleway|service|living_street|steps|track", "covered=yes|arcade|colonnade", "tunnel!=yes|culvert", "indoor!=yes", "area!=yes"]
draw = "line"
corridor_m = 3.0
sprint = "522"

# Firm gravel (sprint only, ADR 0073). ISSprOM 4.5, 501: a paved area is "an area with a firm surface
# such as asphalt, hard gravel, tiles, concrete"; 505 is a way "without a smooth, hard surface".
# `compacted` and `fine_gravel` are firm: a paved line (501.6 to 501.9 by footprint 1.4, 2, 3 and
# 4 m), as a candidate to check against the orthophoto. Loose gravel, sand and earth stay 505.
[[rule]]
when = ["highway=footway|path|bridleway|track", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel", "width>=4"]
draw = "line"
sprint = "501.9"

[[rule]]
when = ["highway=footway|path|bridleway|track", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel", "width>=3"]
draw = "line"
sprint = "501.8"

[[rule]]
when = ["highway=footway|path|bridleway|track", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel", "width>=2"]
draw = "line"
sprint = "501.7"

[[rule]]
when = ["highway=track", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel"]
draw = "line"
sprint = "501.7"

[[rule]]
when = ["highway=footway|path|bridleway", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel"]
draw = "line"
sprint = "501.6"

# Unpaved ways (sprint only). Paved ways and sidewalks have no rule: the ALKIS traffic areas and the
# orthophoto cover them. Map objects only in the open: tunnels, covered and indoor ways and
# pedestrian areas (closed rings) fall through to the candidate rule below.
[[rule]]
when = ["highway=track|path|footway|bridleway", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips", "width<1.5"]
draw = "line"
target = "map"
sprint = "506"

[[rule]]
when = ["highway=path", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips", "trail_visibility=intermediate|bad|horrible|no"]
draw = "line"
target = "map"
sprint = "506"

[[rule]]
when = ["highway=track", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips"]
draw = "line"
target = "map"
sprint = "505.2"

[[rule]]
when = ["highway=path|footway|bridleway", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips", "width>=3"]
draw = "line"
target = "map"
sprint = "505.2"

[[rule]]
when = ["highway=path|footway|bridleway", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips"]
draw = "line"
target = "map"
sprint = "505.1"

# Any other way that is not known to be paved (no surface tag, an unusual surface, or one of the
# ways above that is not in the open): a candidate to check against the orthophoto.
# Tracks without a surface tag: `tracktype` says what they are. grade1 is paved, grade2 mostly firm
# (501.7), grade3 to grade5 unpaved (505.2).
[[rule]]
when = ["highway=track", "tracktype=grade2", "surface!=asphalt|chipseal|concrete|concrete:plates|concrete:lanes|paved|paving_stones|paving_stones:lanes|sett|cobblestone|unhewn_cobblestone|bricks|metal|wood|grass_paver"]
draw = "line"
sprint = "501.7"

[[rule]]
when = ["highway=track", "tracktype=grade3|grade4|grade5", "surface!=asphalt|chipseal|concrete|concrete:plates|concrete:lanes|paved|paving_stones|paving_stones:lanes|sett|cobblestone|unhewn_cobblestone|bricks|metal|wood|grass_paver"]
draw = "line"
sprint = "505.2"

[[rule]]
when = ["highway=track|path|footway|bridleway", "footway!=sidewalk|crossing", "tracktype!=grade1", "surface!=asphalt|chipseal|concrete|concrete:plates|concrete:lanes|paved|paving_stones|paving_stones:lanes|sett|cobblestone|unhewn_cobblestone|bricks|metal|wood|grass_paver"]
draw = "line"
sprint = "505.1"

# Unpaved streets (sand roads in the suburbs): a candidate, and their ALKIS street parcels are not
# drawn as paved areas (`build/paved.rs`).
[[rule]]
when = ["highway=residential|unclassified|service|living_street|tertiary|secondary|primary|road", "surface=unpaved|dirt|earth|ground|grass|gravel|fine_gravel|compacted|sand|woodchips"]
draw = "line"
sprint = "505.2"

# Water (spec §4.5). The combined 301 is used for areas: OSM shapes are not clipped like ALKIS water,
# so the bank line is part of the symbol. Areas inside ALKIS water are dropped by
# `water::drop_covered_water`. Rivers and canals have no rule: their area comes from ALKIS or
# `natural=water`, and a centre line would be the wrong symbol. Culverts and other tunnels are not
# on the surface. The rules list the tunnel values, so `tunnel=no` stays.
[[rule]]
when = ["natural=water", "covered!=yes", "tunnel!=yes|culvert|flooded|building_passage|canal"]
draw = "area"
schoolyard = "301"
sprint = "301"

[[rule]]
when = ["waterway=riverbank"]
draw = "area"
schoolyard = "301"
sprint = "301"

[[rule]]
when = ["landuse=reservoir"]
draw = "area"
schoolyard = "301"
sprint = "301"

# Retention basins are dry most of the time.
[[rule]]
when = ["landuse=basin", "basin!=retention|infiltration|detention"]
draw = "area"
schoolyard = "301"
sprint = "301"

[[rule]]
when = ["leisure=swimming_pool", "indoor!=yes", "covered!=yes", "location!=indoor|underground|roof"]
draw = "area"
schoolyard = "301"
sprint = "301"

# The basin of a fountain drawn as an area; a fountain node falls through to the point rule.
[[rule]]
when = ["amenity=fountain"]
draw = "area"
schoolyard = "301"
sprint = "301"

[[rule]]
when = ["amenity=fountain"]
draw = "point"
schoolyard = "311"
sprint = "311"

[[rule]]
when = ["man_made=water_well"]
draw = "point"
schoolyard = "311"
sprint = "311"

[[rule]]
when = ["natural=spring"]
draw = "point"
schoolyard = "312"
sprint = "312"

[[rule]]
when = ["amenity=drinking_water"]
draw = "point"
schoolyard = "313"

# Streams are crossable (305); a stream that falls dry and every ditch is 306.
[[rule]]
when = ["waterway=stream|drain", "intermittent!=yes", "tunnel!=yes|culvert|flooded|building_passage|canal"]
draw = "line"
schoolyard = "305"
sprint = "305"

[[rule]]
when = ["waterway=stream|drain|ditch", "tunnel!=yes|culvert|flooded|building_passage|canal"]
draw = "line"
schoolyard = "306"
sprint = "306"

# Bridges: ALKIS has none. The deck is paved ground; the bank line across it is a mapper fix.
[[rule]]
when = ["man_made=bridge"]
draw = "area"
sprint = "501.5"

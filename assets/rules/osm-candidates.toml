# OSM tags → symbols for templates/candidates.omap and the map itself (spec §4.5).
#
# The first rule whose conditions and geometry match a feature decides; a map kind without a
# symbol code skips the feature. Conditions in `when` must all hold: `key=value`, `key=a|b`
# (alternatives), `key=*` (any value) or `key!=value` (absent or another value); at least one
# condition must not be negated.
#
# A condition `key<number` holds when the value is a number below it (`1,2 m` reads as 1.2).
#
# `target`: `candidates` (default; templates/candidates.omap) or `map` (reliable enough to be a map
# object, "Sicheres fertig, Rest Vorlage").
#
# `draw`: `point` (nodes), `line` (ways; with `point_as_short_line_mm` also nodes, drawn as a
# short horizontal line of that length on paper for the mapper to rotate), `area` (closed ways).
# Codes refer to ISSprOM 2019 and the IOF school symbol set 2019.

# Underground hydrants are not visible on the ground.
[[rule]]
when = ["emergency=fire_hydrant", "fire_hydrant:type!=underground"]
draw = "point"
schoolyard = "321"

[[rule]]
when = ["amenity=bench"]
draw = "line"
point_as_short_line_mm = 1.5
schoolyard = "543"

[[rule]]
when = ["leisure=picnic_table"]
draw = "point"
schoolyard = "542"

[[rule]]
when = ["amenity=table"]
draw = "point"
schoolyard = "542"

[[rule]]
when = ["highway=street_lamp"]
draw = "point"
schoolyard = "545"

[[rule]]
when = ["man_made=flagpole|mast"]
draw = "point"
schoolyard = "544"

[[rule]]
when = ["playground=*"]
draw = "line"
point_as_short_line_mm = 1.8
schoolyard = "541"

[[rule]]
when = ["natural=tree"]
draw = "point"
schoolyard = "418"
sprint = "418"

[[rule]]
when = ["barrier=hedge"]
draw = "line"
schoolyard = "410.1"
sprint = "410.1"

[[rule]]
when = ["barrier=wall"]
draw = "line"
schoolyard = "515"
sprint = "515"

[[rule]]
when = ["barrier=retaining_wall"]
draw = "line"
schoolyard = "513.2"
sprint = "513.2"

[[rule]]
when = ["barrier=fence"]
draw = "line"
schoolyard = "518"
sprint = "518"

[[rule]]
when = ["natural=cliff"]
draw = "line"
schoolyard = "201"
sprint = "201"

[[rule]]
when = ["leisure=pitch|track", "surface=tartan|asphalt|concrete"]
draw = "area"
schoolyard = "501.10"
sprint = "501.10"

[[rule]]
when = ["leisure=pitch", "surface=grass"]
draw = "area"
schoolyard = "401"
sprint = "401"

# Unpaved ways (sprint only). Paved ways and sidewalks have no rule: the ALKIS traffic areas and the
# orthophoto cover them.
[[rule]]
when = ["highway=track|path|footway|bridleway", "footway!=sidewalk|crossing", "surface=unpaved|dirt|earth|ground|grass|gravel|fine_gravel|compacted|sand|woodchips", "width<1.5"]
draw = "line"
target = "map"
sprint = "506"

[[rule]]
when = ["highway=path", "footway!=sidewalk|crossing", "surface=unpaved|dirt|earth|ground|grass|gravel|fine_gravel|compacted|sand|woodchips", "trail_visibility=intermediate|bad|horrible|no"]
draw = "line"
target = "map"
sprint = "506"

[[rule]]
when = ["highway=track", "surface=unpaved|dirt|earth|ground|grass|gravel|fine_gravel|compacted|sand|woodchips"]
draw = "line"
target = "map"
sprint = "505.2"

[[rule]]
when = ["highway=path|footway|bridleway", "footway!=sidewalk|crossing", "surface=unpaved|dirt|earth|ground|grass|gravel|fine_gravel|compacted|sand|woodchips"]
draw = "line"
target = "map"
sprint = "505.1"

# Without a surface tag the way may be paved: a candidate to check against the orthophoto.
[[rule]]
when = ["highway=track|path|footway|bridleway", "footway!=sidewalk|crossing", "surface!=*"]
draw = "line"
sprint = "505.1"

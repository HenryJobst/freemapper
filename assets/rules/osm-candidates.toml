# OSM tags → symbols for templates/candidates.omap and the map itself (spec §4.5).
#
# The first rule whose conditions and geometry match a feature decides; a map kind without a
# symbol code skips the feature. Conditions in `when` must all hold: `key=value`, `key=a|b`
# (alternatives), `key=*` (any value) or `key!=value` (absent or another value); at least one
# condition must not be negated.
#
# A condition `key<number` holds when the value is a number below it (`1,2 m` reads as 1.2).
#
# `target`: `candidates` (default; templates/candidates.omap) or `map` (reliable enough to be a map
# object, "Sicheres fertig, Rest Vorlage").
#
# `draw`: `point` (nodes), `line` (ways; with `point_as_short_line_mm` also nodes, drawn as a
# short horizontal line of that length on paper for the mapper to rotate), `area` (closed ways).
# `corridor_m`: with `draw = "line"`, a way becomes an area, a strip along it of this width in
# metres (its `width` tag if it has one; 1.5 to 12 m). The symbol must be an area symbol.
#
# Codes refer to ISSprOM 2019 and the IOF school symbol set 2019; `forest` codes to ISOM 2017-2. A
# rule without `forest` gives a forest map its sprint code, which the ISOM set answers through
# `assets/symbol-sets/isom-aliases.toml`; `forest = "-"` leaves the feature out of a forest map.

# Underground hydrants are not visible on the ground.
[[rule]]
when = ["emergency=fire_hydrant", "fire_hydrant:type!=underground"]
draw = "point"
schoolyard = "321"

# Control sites for course setters (sprint only, candidates only, ADR 0074): bollards, street lamps,
# waste baskets, bicycle racks and benches are good control locations, but a sprint map does not
# draw them. ISSprOM 4.5, 531 "Prominent man-made feature - x": "a man-made feature which is
# significant or prominent. The definition of the symbol must be given on the map." Each carries
# `freemapper:control=<kind>`. `build/control_sites.rs` drops the ones in a row or a pair, and
# `build/points.rs` keeps the gap between the symbols.
[[rule]]
when = ["amenity=bench"]
draw = "point"
sprint = "531"

[[rule]]
when = ["amenity=bench"]
draw = "line"
point_as_short_line_mm = 1.5
schoolyard = "543"

# Memorials (sprint only, candidates only, ADR 0075). ISSprOM 4.5, 526 "Cairn, memorial, small
# monument or boundary stone that is obvious". What is flush with the ground or hangs on a wall is
# not obvious: Stolpersteine (the census found 118 in two small boxes), plaques and plates, and
# memorials that are a bench, a tree, a mural or a ghost bike. Only nodes: an area memorial is a
# building (521) or a 521 mapper job.
[[rule]]
when = ["historic=memorial|monument|wayside_cross|boundary_stone", "memorial!=stolperstein|stolperschwelle|plaque|plate|ground_plaque|blue_plaque|bench|ghost_bike|mural|tree", "memorial:type!=stolperstein|stolperschwelle|plaque"]
draw = "point"
sprint = "526"

[[rule]]
when = ["barrier=bollard"]
draw = "point"
sprint = "531"

[[rule]]
when = ["amenity=waste_basket"]
draw = "point"
sprint = "531"

[[rule]]
when = ["amenity=bicycle_parking"]
draw = "point"
sprint = "531"

[[rule]]
when = ["leisure=picnic_table"]
draw = "point"
schoolyard = "542"

[[rule]]
when = ["amenity=table"]
draw = "point"
schoolyard = "542"

[[rule]]
when = ["highway=street_lamp"]
draw = "point"
schoolyard = "545"
sprint = "531"

[[rule]]
when = ["man_made=flagpole"]
draw = "point"
schoolyard = "544"

# Masts (ADR 0083): the school flagpole symbol, and on a sprint map a tower, see the tower rules at
# the end of this file. A mast of 20 m or more is a high tower (524), one of 10 to 20 m a small tower
# (525), and one without a `height` a radio or telecom mast (524). A lower mast (a sign, a lamp, a
# flag) is no tower: in the Viktoriapark a 3 m mast gave a 525 beside a Berlin column.
[[rule]]
when = ["man_made=mast", "height>=20"]
draw = "point"
schoolyard = "544"
sprint = "524"

[[rule]]
when = ["man_made=mast", "height>=10"]
draw = "point"
schoolyard = "544"
sprint = "525"

[[rule]]
when = ["man_made=mast", "height!=*"]
draw = "point"
schoolyard = "544"
sprint = "524"

[[rule]]
when = ["man_made=mast"]
draw = "point"
schoolyard = "544"

[[rule]]
when = ["playground=*"]
draw = "line"
point_as_short_line_mm = 1.8
schoolyard = "541"

[[rule]]
when = ["natural=tree"]
draw = "point"
schoolyard = "418"
sprint = "418"

[[rule]]
when = ["barrier=hedge"]
draw = "line"
schoolyard = "410.1"
sprint = "410.1"

[[rule]]
when = ["barrier=wall"]
draw = "line"
schoolyard = "515"
sprint = "515"

[[rule]]
when = ["barrier=retaining_wall"]
draw = "line"
schoolyard = "513.2"
sprint = "513.2"

[[rule]]
when = ["barrier=fence"]
draw = "line"
schoolyard = "518"
sprint = "518"

[[rule]]
when = ["natural=cliff"]
draw = "line"
schoolyard = "201"
sprint = "201"

# Private areas (sprint only, ADR 0073). ISSprOM 4.5, 520: "An area that shall not be entered such
# as a private area, a flower bed, a railway area etc." `access=private|no` on a land use, leisure or
# amenity area; the area rules below (pitch, park, grass) would give it a ground symbol. Water keeps
# its rule: a private pool or pond is still water.
[[rule]]
when = ["landuse=*", "landuse!=reservoir|basin", "access=private|no"]
draw = "area"
sprint = "520"

[[rule]]
when = ["leisure=garden|pitch|playground|sports_centre|golf_course|track|stadium|park|recreation_ground|dog_park|miniature_golf|horse_riding|ice_rink", "access=private|no"]
draw = "area"
sprint = "520"

[[rule]]
when = ["amenity=parking|school|kindergarten|childcare|college|university|hospital|grave_yard|social_facility|fuel|car_wash|marketplace", "access=private|no"]
draw = "area"
sprint = "520"

[[rule]]
when = ["leisure=pitch|track", "surface=tartan|asphalt|concrete"]
draw = "area"
schoolyard = "501.10"
sprint = "501.10"

[[rule]]
when = ["leisure=pitch", "surface=grass"]
draw = "area"
schoolyard = "401"
sprint = "401"

# Parks, lawns and meadows: open land (401) candidates. Where an ALKIS park, meadow or wood is a map
# object, the OSM area adds nothing and goes (`build/open_land.rs`, ADR 0069).
[[rule]]
when = ["leisure=park"]
draw = "area"
schoolyard = "401"
sprint = "401"
# A park in a forest is forest; its lawns are tagged as such.
forest = "-"

[[rule]]
when = ["landuse=grass|meadow|village_green|recreation_ground"]
draw = "area"
schoolyard = "401"
sprint = "401"

# Forest maps (ISOM 2017-2), spec 2026-11-13. The OSM paths are the path network of a forest map
# and go onto the map as they are, private ones included (ISOM has no closed way; an area that
# shall not be entered is 520 from the rules further down). Nothing is merged or moved. These
# rules have no sprint or schoolyard code, so the other map kinds skip them.

# What ISOM does not draw at 1:15000: sidewalks, crossings, driveways and parking aisles.
[[rule]]
when = ["highway=*", "footway=sidewalk|crossing", "area!=yes", "indoor!=yes"]
draw = "line"
forest = "-"

[[rule]]
when = ["highway=*", "cycleway=sidewalk|crossing", "area!=yes", "indoor!=yes"]
draw = "line"
forest = "-"

[[rule]]
when = ["highway=service", "service=driveway|parking_aisle", "area!=yes", "indoor!=yes"]
draw = "line"
forest = "-"

# 532 stairway.
[[rule]]
when = ["highway=steps", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "532"

# 507 less distinct small path.
[[rule]]
when = ["highway=path|footway|bridleway", "trail_visibility=bad|horrible|no", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "507"

[[rule]]
when = ["highway=path|footway|bridleway", "informal=yes", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "507"

# 502 wide road, 503 road: the public roads; an unpaved one is a vehicle track (504).
[[rule]]
when = ["highway=motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "502"

[[rule]]
when = ["highway=residential|unclassified", "width>=5", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "502"

[[rule]]
when = ["highway=residential|unclassified|living_street|service|road", "surface=unpaved|dirt|earth|ground|grass|gravel|fine_gravel|sand|woodchips|mud|pebblestone", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "504"

[[rule]]
when = ["highway=residential|unclassified|living_street|service|road", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "503"

# 504 vehicle track: tracks of grade 1 and 2 or at least 3 m wide; 505 the other tracks.
[[rule]]
when = ["highway=track", "tracktype=grade1|grade2", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "504"

[[rule]]
when = ["highway=track", "width>=3", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "504"

[[rule]]
when = ["highway=track", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "505"

# 505 footpath: cycleways, pedestrian ways and paths at least 1.5 m wide or with a firm surface;
# 506 small path: the other paths.
[[rule]]
when = ["highway=cycleway|pedestrian", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "505"

[[rule]]
when = ["highway=path|footway|bridleway", "width>=1.5", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "505"

[[rule]]
when = ["highway=path|footway|bridleway", "surface=asphalt|chipseal|concrete|concrete:plates|concrete:lanes|paved|paving_stones|sett|cobblestone|bricks|compacted|fine_gravel|gravel", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "505"

[[rule]]
when = ["highway=path|footway|bridleway", "area!=yes", "indoor!=yes"]
draw = "line"
target = "map"
forest = "506"

# Land cover of a forest map, as candidates: open land, rough open land and the green that OSM
# says. Forest itself (`landuse=forest`, `natural=wood`) is the white paper and has no rule.
[[rule]]
when = ["natural=grassland"]
draw = "area"
forest = "401"

[[rule]]
when = ["natural=heath"]
draw = "area"
forest = "403"

[[rule]]
when = ["landuse=clearing"]
draw = "area"
forest = "403"

[[rule]]
when = ["natural=scrub", "density=dense"]
draw = "area"
forest = "408"

[[rule]]
when = ["landcover=scrub", "density=dense"]
draw = "area"
forest = "408"

[[rule]]
when = ["natural=scrub"]
draw = "area"
forest = "406"

# Closed ways (sprint only, ADR 0073): a private or closed way is no path to run on but part of an
# area that shall not be entered (ISSprOM 4.5, 520). The way is the centre line, the strip along it
# (2 m for footways, 3 m for service roads and tracks, or the `width` tag) the candidate. `foot=yes`,
# `permissive` or `designated` lets a runner in. `access=destination|customers|permit` is not
# closed. A cycleway or service road with only `foot=no` is a road a runner can cross.
[[rule]]
when = ["highway=footway|path|pedestrian|steps|bridleway", "access=private|no", "foot!=yes|permissive|designated", "area!=yes", "indoor!=yes"]
draw = "line"
corridor_m = 2.0
sprint = "520"

[[rule]]
when = ["highway=footway|path|pedestrian|steps|bridleway", "foot=private|no", "area!=yes", "indoor!=yes"]
draw = "line"
corridor_m = 2.0
sprint = "520"

[[rule]]
when = ["highway=service|track|cycleway", "access=private|no", "foot!=yes|permissive|designated", "area!=yes", "indoor!=yes"]
draw = "line"
corridor_m = 3.0
sprint = "520"

[[rule]]
when = ["highway=service|track|cycleway", "foot=private", "area!=yes", "indoor!=yes"]
draw = "line"
corridor_m = 3.0
sprint = "520"

# Passages through buildings and arcades (sprint only, ADR 0072). ISSprOM 4.5, 522 canopy: "a
# building construction (with a roof), normally supported by pillars, poles or walls, such as
# passages, gangways, courts". The way is the centre line, the strip along it the candidate; the
# building stays whole (as for the ALKIS passages, ADR 0061). The surface does not matter: a
# passage decides routes whether it is paved or not. Real tunnels and indoor ways are no passage.
[[rule]]
when = ["highway=*", "tunnel=building_passage", "indoor!=yes", "area!=yes"]
draw = "line"
corridor_m = 3.0
sprint = "522"

[[rule]]
when = ["highway=footway|path|pedestrian|cycleway|service|living_street|steps|track", "covered=yes|arcade|colonnade", "tunnel!=yes|culvert", "indoor!=yes", "area!=yes"]
draw = "line"
corridor_m = 3.0
sprint = "522"

# OSM stairs (sprint only, ADR 0101). ISSprOM 4.5, 532: a stairway is a line that runs uphill; the
# footprint symbol follows the width: 532.6 (1.6 m) to 532.9 (4 m at 1:4000). Closed, covered,
# underground and indoor stairs fall through to the rules above and below. `build/candidates.rs`
# turns a way tagged `incline=down` round; `build/dedup.rs` lets an official stair of the same
# symbol win.
[[rule]]
when = ["highway=steps", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "width>=3.5"]
draw = "line"
sprint = "532.9"

[[rule]]
when = ["highway=steps", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "width>=2.5"]
draw = "line"
sprint = "532.8"

[[rule]]
when = ["highway=steps", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "width>=1.8"]
draw = "line"
sprint = "532.7"

[[rule]]
when = ["highway=steps", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes"]
draw = "line"
sprint = "532.6"

# Firm and paved ways (sprint only, ADR 0073, amended by ADR 0079 and 0098). ISSprOM 4.5, 501: a
# paved area is "an area with a firm surface such as asphalt, hard gravel, tiles, concrete"; 505 is
# a way "without a smooth, hard surface". `compacted`, `fine_gravel` and the paved surfaces
# (asphalt, paving stones, concrete, sett and the like) are firm: a paved line (501.6 to 501.9 by
# footprint 1.4, 2, 3 and 4 m, with the black border of the symbol), a map object like the unpaved
# ways below; `build/firm_paths.rs` cuts it where ALKIS paving lies, so a paved area outranks the
# way. Loose gravel, sand and earth stay 505. Sidewalks and crossings have no rule.
[[rule]]
when = ["highway=footway|path|bridleway|track", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel|asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes", "width>=4"]
draw = "line"
target = "map"
sprint = "501.9"

[[rule]]
when = ["highway=footway|path|bridleway|track", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel|asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes", "width>=3"]
draw = "line"
target = "map"
sprint = "501.8"

[[rule]]
when = ["highway=footway|path|bridleway|track", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel|asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes", "width>=2"]
draw = "line"
target = "map"
sprint = "501.7"

[[rule]]
when = ["highway=track", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel|asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes"]
draw = "line"
target = "map"
sprint = "501.7"

[[rule]]
when = ["highway=footway|path|bridleway", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=compacted|fine_gravel|asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes"]
draw = "line"
target = "map"
sprint = "501.6"

# Paved service ways (sprint only, ADR 0098): a driveway, a courtyard road or the access to a castle
# is a paved way wider than a footpath: 501.6 to 501.9 by `width`, 501.8 (3 m) without one. Other
# streets keep no rule, the ALKIS traffic areas show them.
[[rule]]
when = ["highway=service", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes", "width>=4"]
draw = "line"
target = "map"
sprint = "501.9"

[[rule]]
when = ["highway=service", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes", "width>=3"]
draw = "line"
target = "map"
sprint = "501.8"

[[rule]]
when = ["highway=service", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes", "width>=2"]
draw = "line"
target = "map"
sprint = "501.7"

[[rule]]
when = ["highway=service", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes", "width<2"]
draw = "line"
target = "map"
sprint = "501.6"

[[rule]]
when = ["highway=service", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=asphalt|paved|paving_stones|concrete|sett|cobblestone|bricks|chipseal|concrete:plates|concrete:lanes"]
draw = "line"
target = "map"
sprint = "501.8"

# Unpaved ways (sprint only). Sidewalks have no rule: the ALKIS traffic areas and the
# orthophoto cover them. Map objects only in the open: tunnels, covered and indoor ways and
# pedestrian areas (closed rings) fall through to the candidate rule below.
[[rule]]
when = ["highway=track|path|footway|bridleway", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips", "width<1.5"]
draw = "line"
target = "map"
sprint = "506"

[[rule]]
when = ["highway=path", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips", "trail_visibility=intermediate|bad|horrible|no"]
draw = "line"
target = "map"
sprint = "506"

[[rule]]
when = ["highway=track", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips"]
draw = "line"
target = "map"
sprint = "505.2"

[[rule]]
when = ["highway=path|footway|bridleway", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips", "width>=3"]
draw = "line"
target = "map"
sprint = "505.2"

[[rule]]
when = ["highway=path|footway|bridleway", "footway!=sidewalk|crossing", "tunnel!=*", "covered!=yes", "indoor!=yes", "area!=yes", "surface=unpaved|dirt|earth|ground|grass|gravel|sand|woodchips"]
draw = "line"
target = "map"
sprint = "505.1"

# Any other way that is not known to be paved (no surface tag, an unusual surface, or one of the
# ways above that is not in the open): a candidate to check against the orthophoto.
# Tracks without a surface tag: `tracktype` says what they are. grade1 is paved, grade2 mostly firm
# (501.7, a map object), grade3 to grade5 unpaved (505.2, a candidate).
[[rule]]
when = ["highway=track", "tracktype=grade2", "surface!=asphalt|chipseal|concrete|concrete:plates|concrete:lanes|paved|paving_stones|paving_stones:lanes|sett|cobblestone|unhewn_cobblestone|bricks|metal|wood|grass_paver"]
draw = "line"
target = "map"
sprint = "501.7"

[[rule]]
when = ["highway=track", "tracktype=grade3|grade4|grade5", "surface!=asphalt|chipseal|concrete|concrete:plates|concrete:lanes|paved|paving_stones|paving_stones:lanes|sett|cobblestone|unhewn_cobblestone|bricks|metal|wood|grass_paver"]
draw = "line"
sprint = "505.2"

[[rule]]
when = ["highway=track|path|footway|bridleway", "footway!=sidewalk|crossing", "tracktype!=grade1", "surface!=asphalt|chipseal|concrete|concrete:plates|concrete:lanes|paved|paving_stones|paving_stones:lanes|sett|cobblestone|unhewn_cobblestone|bricks|metal|wood|grass_paver"]
draw = "line"
sprint = "505.1"

# Unpaved streets (sand roads in the suburbs): a candidate, and their ALKIS street parcels are not
# drawn as paved areas (`build/paved.rs`).
[[rule]]
when = ["highway=residential|unclassified|service|living_street|tertiary|secondary|primary|road", "surface=unpaved|dirt|earth|ground|grass|gravel|fine_gravel|compacted|sand|woodchips"]
draw = "line"
sprint = "505.2"

# Water (spec §4.5). The combined 301 is used for areas: OSM shapes are not clipped like ALKIS water,
# so the bank line is part of the symbol. Areas inside ALKIS water are dropped by
# `water::drop_covered_water`. Rivers and canals have no rule: their area comes from ALKIS or
# `natural=water`, and a centre line would be the wrong symbol. Culverts and other tunnels are not
# on the surface. The rules list the tunnel values, so `tunnel=no` stays.
[[rule]]
when = ["natural=water", "covered!=yes", "tunnel!=yes|culvert|flooded|building_passage|canal"]
draw = "area"
schoolyard = "301"
sprint = "301"

[[rule]]
when = ["waterway=riverbank"]
draw = "area"
schoolyard = "301"
sprint = "301"

[[rule]]
when = ["landuse=reservoir"]
draw = "area"
schoolyard = "301"
sprint = "301"

# Retention basins are dry most of the time.
[[rule]]
when = ["landuse=basin", "basin!=retention|infiltration|detention"]
draw = "area"
schoolyard = "301"
sprint = "301"

[[rule]]
when = ["leisure=swimming_pool", "indoor!=yes", "covered!=yes", "location!=indoor|underground|roof"]
draw = "area"
schoolyard = "301"
sprint = "301"

# The basin of a fountain drawn as an area; a fountain node falls through to the point rule.
[[rule]]
when = ["amenity=fountain"]
draw = "area"
schoolyard = "301"
sprint = "301"

[[rule]]
when = ["amenity=fountain"]
draw = "point"
schoolyard = "311"
sprint = "311"

[[rule]]
when = ["man_made=water_well"]
draw = "point"
schoolyard = "311"
sprint = "311"

[[rule]]
when = ["natural=spring"]
draw = "point"
schoolyard = "312"
sprint = "312"

[[rule]]
when = ["amenity=drinking_water"]
draw = "point"
schoolyard = "313"
sprint = "313"

# Streams are crossable (305); a stream that falls dry and every ditch is 306.
[[rule]]
when = ["waterway=stream|drain", "intermittent!=yes", "tunnel!=yes|culvert|flooded|building_passage|canal"]
draw = "line"
schoolyard = "305"
sprint = "305"

[[rule]]
when = ["waterway=stream|drain|ditch", "tunnel!=yes|culvert|flooded|building_passage|canal"]
draw = "line"
schoolyard = "306"
sprint = "306"

# Bridges: ALKIS has none. The deck is paved ground; the bank line across it is a mapper fix.
[[rule]]
when = ["man_made=bridge"]
draw = "area"
sprint = "501.5"

# Power lines (sprint only, candidates only, ADR 0083). ISSprOM 4.5, 510 "Power line, cableway or ski
# lift": "The bars indicate the exact location of the pylons. If a section of a power line ...
# goes along a road or path (and does not offer significant additional navigational value) it
# should be omitted." Minimum length 3.75 mm (footprint 15 m). 511 "Major power line" is drawn with a
# double line; 110 kV and up is taken as major (`voltage` may list several values, one is enough).
# Underground and underwater cables, tunnels and the busbars inside a substation are not on the
# ground. A bare `power=cable` is underground in OSM; only `location=overhead` is a line.
[[rule]]
when = ["power=line", "voltage>=110000", "location!=underground|underwater", "tunnel!=yes", "line!=busbar|bay|connection"]
draw = "line"
sprint = "511"

[[rule]]
when = ["power=line|minor_line", "location!=underground|underwater", "tunnel!=yes", "line!=busbar|bay|connection"]
draw = "line"
sprint = "510"

[[rule]]
when = ["power=cable", "location=overhead"]
draw = "line"
sprint = "510"

# Railways (sprint only, ADR 0093). ISSprOM 4.5, 509.1 "Railway": "a permanent track laid with rails
# on which locomotives, carriages or wagons can travel", minimum length (isolated) 4 mm. 509.2
# "Tramway": "generally not represented. However, if they serve navigation or orientation, they can
# be represented". Trains are the most reliable line in OSM, so `rail`, `light_rail` and
# `narrow_gauge` are map objects, bridges included (the line crosses over the road or the water).
# Sidings, yard tracks and spurs are tracks too and have the same symbol; crossovers between two
# main tracks only add clutter at this scale. Tunnels, passages under buildings, culverts and
# everything that is disused, abandoned, razed, proposed or under construction are not on the
# ground. A subway runs below ground unless `bridge=yes` says it is a viaduct; an untagged one is a
# candidate. A tram is a candidate: whether it serves navigation is for the mapper.
[[rule]]
when = ["railway=rail|light_rail|narrow_gauge", "service!=crossover", "tunnel!=yes|building_passage|culvert", "location!=underground", "area!=yes"]
draw = "line"
target = "map"
sprint = "509.1"

[[rule]]
when = ["railway=subway", "bridge=yes|viaduct", "tunnel!=yes|building_passage|culvert", "location!=underground"]
draw = "line"
target = "map"
sprint = "509.1"

[[rule]]
when = ["railway=subway", "tunnel!=yes|building_passage|culvert", "location!=underground"]
draw = "line"
sprint = "509.1"

[[rule]]
when = ["railway=tram", "service!=crossover", "tunnel!=yes|building_passage|culvert", "location!=underground"]
draw = "line"
sprint = "509.2"

# Pipelines above ground (sprint only, candidates only, ADR 0083). ISSprOM 4.5, 528 prominent line
# feature: "a low pipeline (gas, water, oil, heat, etc.)", minimum length 2.2 mm; 529 prominent
# uncrossable line feature: "a high pipeline", minimum length 3 mm. "The definition of the symbol
# must be given on the map." OSM does not say whether a pipeline can be crossed: `location=overhead`
# or a `height` of 1.5 m is high. A pipeline without a `location` is taken to be buried.
[[rule]]
when = ["man_made=pipeline", "location=overhead", "tunnel!=yes"]
draw = "line"
sprint = "529"

[[rule]]
when = ["man_made=pipeline", "location=overground|surface", "height>=1.5", "tunnel!=yes"]
draw = "line"
sprint = "529"

[[rule]]
when = ["man_made=pipeline", "location=overground|surface", "tunnel!=yes"]
draw = "line"
sprint = "528"

# Towers and masts (sprint only, candidates only, ADR 0083). ISSprOM 4.5, 524 "High tower": "A high
# tower or large pylon. Very large towers shall be represented in plan shape with the symbol
# Building (521)"; 525 "Small tower": "An obvious small tower, platform or seat". Only nodes: a
# tower drawn as an outline is a cadastre building (521), and a point inside a building is dropped
# anyway (ADR 0076). Each carries `freemapper:control=` (pylon, mast, tower, chimney, water_tower,
# lighthouse), so that a course setter finds the ones that make a good control; `build/control_sites.rs`
# drops a second one of the same kind within 25 m. `power=pole` has no rule: the bars of the 510
# line are its poles. A pylon that stands on a 511 major line is a 524 as the norm asks.
[[rule]]
when = ["power=tower"]
draw = "point"
sprint = "524"

[[rule]]
when = ["man_made=tower", "tower:type=observation|watchtower|platform"]
draw = "point"
sprint = "525"

[[rule]]
when = ["man_made=tower", "height<20"]
draw = "point"
sprint = "525"

[[rule]]
when = ["man_made=tower|communications_tower|chimney|water_tower|lighthouse"]
draw = "point"
sprint = "524"

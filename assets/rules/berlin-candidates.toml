# Geoportal Berlin features → candidate symbols (Berlin plus 1). Same syntax and engine as
# osm-candidates.toml, with these differences:
#
# - Tags are `berlin:<property>` (string and number properties of the WFS feature) plus
#   `berlin:layer=<layer file>`, so an OSM rule can never match a Berlin feature and the other
#   way round. Every rule names its layer.
# - A condition value ending in `*` is a prefix (`Mauerkante*` = `Mauerkante, rechts` …).
# - A polygon is its exterior as a closed line (`draw = "line"` or `"area"`) and a point at its
#   centroid (`draw = "point"`). Holes are dropped: these are candidates only.
#
# Not here: ALKIS Überdachung/Carport (522 map objects, `build/canopy.rs`), stairs
# (`build/stairs.rs`: the walking direction of a stair area comes from the DGM, and the
# `Freitreppe` lines of `bauwerke-linien` are step edges that are joined into one stair per
# flight), Kleingarten (a land use, `build/out_of_bounds.rs`) and the surveyed green strips and
# paving (`sb-gruenflaeche`, `sb-flaechen`: cut out of and added to the paved areas,
# `build/paved.rs`) and the surveyed stairs (`sb-treppe`, `build/stairs.rs`). ALKIS kerb lines
# (`Fahrbahnbegrenzungslinie`) are not taken; the surveyed curbs are (below). The height of a
# wall decides nothing; the ALKIS name picks the symbol.
#
# The Straßenbefahrung rules (Berlin plus 2) name the survey type in `berlin:layer`
# (`bd_bordstein`, no namespace). Their candidates carry the survey date as
# `freemapper:currency`. No rule reads an undocumented survey code (`material`, `hms`, `pot` …).

# Walls, retaining walls and fences by the ALKIS name (the same symbols as the OSM rules).
[[rule]]
when = ["berlin:layer=bauwerke-linien|bauwerke-flaechen", "berlin:bezbwf=Mauer|Mauerkante*|Mauermitte"]
draw = "line"
schoolyard = "515"
sprint = "515"

[[rule]]
when = ["berlin:layer=bauwerke-linien|bauwerke-flaechen", "berlin:bezbwf=Stützmauer*"]
draw = "line"
schoolyard = "513.2"
sprint = "513.2"

[[rule]]
when = ["berlin:layer=bauwerke-linien", "berlin:bezbwf=Zaun"]
draw = "line"
schoolyard = "518"
sprint = "518"

[[rule]]
when = ["berlin:layer=vegetation-linien", "berlin:bezbws=Heckenkante*"]
draw = "line"
schoolyard = "410.1"
sprint = "410.1"

# Monuments: a point at the centroid; areas wider than 3 m are tagged `freemapper:size=large`.
[[rule]]
when = ["berlin:layer=bauwerke-flaechen", "berlin:bezbwf=Denkmal, Denkstein, Standbild"]
draw = "point"
schoolyard = "526"
sprint = "526"

# Bridges: the area of the bridge deck.
[[rule]]
when = ["berlin:layer=bauwerke-flaechen", "berlin:bezbwf=Brücke"]
draw = "area"
sprint = "501.5"

# Embankment top; the bottom edge and the other boundary edges are skipped.
[[rule]]
when = ["berlin:layer=relief", "berlin:bezart=Oberkante"]
draw = "line"
sprint = "104"

# Passages through buildings: the 521 object stays whole, the passage is a canopy candidate (the
# data does not say whether it is gated). "Auskragender Geschossteil / zurückspringendes Geschoss"
# mixes overhangs with set-back storeys and is left out. The second value has a no-break space after "an" (written \u00a0).
[[rule]]
when = ["berlin:layer=building-parts", "berlin:bauart=Durchfahrt im Gebäude|Durchfahrt an\u00a0überbautem Verkehrsweg|Arkade"]
draw = "area"
schoolyard = "522"
sprint = "522"

# Trees of the tree cadastre (street and park trees): a crown of 10 m or more is a large tree
# (417), every other tree, and one without a crown diameter, is 418. Candidates only: the
# cadastre can be older than the trees. The first matching rule wins. The species and crown
# diameter are in `freemapper:baum`.
[[rule]]
when = ["berlin:layer=strassenbaeume|anlagenbaeume", "berlin:kronedurch>=10"]
draw = "point"
schoolyard = "417"
sprint = "417"

[[rule]]
when = ["berlin:layer=strassenbaeume|anlagenbaeume"]
draw = "point"
schoolyard = "418"
sprint = "418"

# --- Straßenbefahrung 2014-2016 (Berlin plus 2) -------------------------------------------------

# Curbs: sprint maps only (a schoolyard map has no street space to speak of).
[[rule]]
when = ["berlin:layer=bd_bordstein"]
draw = "line"
sprint = "501.1"

# Walls (the same symbol as the ALKIS ones).
[[rule]]
when = ["berlin:layer=bh_mauer"]
draw = "line"
schoolyard = "515"
sprint = "515"

# Railings, traffic barriers and crash barriers are impassable like fences; the mapper downgrades
# them to 516 where they can be crossed.
[[rule]]
when = ["berlin:layer=bf_gelaender|bb_verkehrsschutzgitter|bg_leitplanke"]
draw = "line"
schoolyard = "518"
sprint = "518"

# Street furniture of the schoolyard only: on a sprint map the 2 392 bollards of one km² would
# flood the candidates.
[[rule]]
when = ["berlin:layer=bj_sitzbank"]
draw = "line"
point_as_short_line_mm = 1.5
schoolyard = "543"

[[rule]]
when = ["berlin:layer=aq_hydrant"]
draw = "point"
schoolyard = "321"

[[rule]]
when = ["berlin:layer=av_poller|as_mast|am_fahnenmast"]
draw = "point"
schoolyard = "544"

[[rule]]
when = ["berlin:layer=aw_spielgeraet"]
draw = "line"
point_as_short_line_mm = 1.8
schoolyard = "541"

# Advertising columns are a landmark on a sprint map.
[[rule]]
when = ["berlin:layer=ag_werbesaeule"]
draw = "point"
sprint = "531"

# Bus shelters: the roof area.
[[rule]]
when = ["berlin:layer=br_fahrgastunterstand"]
draw = "area"
schoolyard = "522"
sprint = "522"

# Street pumps and ornamental fountains: a point.
[[rule]]
when = ["berlin:layer=af_wasserpumpen_brunnen|bv_springbrunnen_zierbrunnen"]
draw = "point"
schoolyard = "311"
sprint = "311"

[[rule]]
when = ["berlin:layer=ac_trinkwasserbrunnen_wasserspender"]
draw = "point"
schoolyard = "313"
